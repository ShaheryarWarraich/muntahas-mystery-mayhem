"use strict";
/* ============================================================
   MUNTAHA'S MYSTERY MAYHEM
   A 2.5D detective mystery game — designed by Muntaha
   Engine + Case No.1: The Stolen Recipe Book
   ============================================================ */

const W = 480, H = 800;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);

function fitCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width  = W * DPR;
  cv.height = H * DPR;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

/* ---------------- palette -------------------------------- */
const COLORS = {
  bgTop:'#ffd9ee', bgBot:'#e6d0ff',
  pink:'#ff5fae', pinkDeep:'#e2429a', pinkPale:'#ffd6ea',
  purple:'#9b6dff', purpleDeep:'#7a4fd8', purplePale:'#eadcff',
  blue:'#4fb8ff', blueDeep:'#2f8fe0', bluePale:'#d8ecff',
  mint:'#5fe0b0', cream:'#fffdfe', gold:'#ffd166', goldDeep:'#f0a832',
  ink:'#5b2a52', inkSoft:'#a06b9a',
  shadow:'rgba(200,60,150,0.20)'
};
/* Cozy-Noir tokens (style D) — used by the title now, night cases later */
const NIGHT = {
  wall1:'#3a2a5e', wall2:'#2a1e46', floor1:'#37285c', floor2:'#241a3f',
  sky1:'#3a2a5e', sky2:'#180f30', silhouette:'#140d28',
  neonPink:'#ff6fc0', neonBlue:'#5fd6ff', lamp:'rgba(255,200,120,0.30)',
  ink:'#f0e6ff', inkSoft:'#b9a9d9'
};
function glowSpot(x, y, r, col, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = a === undefined ? 0.6 : a;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2); ctx.restore();
}
function neon(s2, x, y, size, col){
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = 24;
  txt(s2, x, y, size, {bold:true, color:col});
  txt(s2, x, y, size, {bold:true, color:'#fff', alpha:0.28});
  ctx.restore();
}
function C(k){ return COLORS[k]; }
const FONT = '"Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",sans-serif';

/* ---------------- tiny draw helpers ----------------------- */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,fill){ rr(x,y,w,h,r); ctx.fillStyle = fill; ctx.fill(); }
function vGrad(x,y,h,c1,c2){ const g = ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,c1); g.addColorStop(1,c2); return g; }
function softShadow(on, blur, col){
  if(on){ ctx.shadowColor = col || C('shadow'); ctx.shadowBlur = blur || 12; ctx.shadowOffsetY = 4; }
  else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
function txt(s, x, y, size, o){
  o = o || {};
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = o.color || C('ink');
  ctx.font = (o.bold ? '800 ' : '600 ') + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if(o.rot){ ctx.translate(x,y); ctx.rotate(o.rot); x = 0; y = 0; }
  if(o.outline){ ctx.lineWidth = size/6; ctx.strokeStyle = o.outline; ctx.lineJoin='round'; ctx.strokeText(s,x,y); }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function wrapLines(s, size, maxW, bold){
  ctx.font = (bold?'800 ':'600 ') + size + 'px ' + FONT;
  const words = s.split(' '), lines = []; let cur = '';
  for(const w of words){
    const t = cur ? cur + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}
function quadf(x1,y1,x2,y2,x3,y3,x4,y4,fill){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function ell(x,y,rx,ry,fill,alpha){
  ctx.save(); ctx.globalAlpha = alpha===undefined?1:alpha; ctx.fillStyle = fill;
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function menuBG(){
  ctx.fillStyle = vGrad(0,0,H,C('bgTop'),C('bgBot'));
  ctx.fillRect(0,0,W,H);
  drawAmbientSparkles();
}
function star(x,y,r,fill,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a = -Math.PI/2 + i*Math.PI*2/5;
    const a2 = a + Math.PI/5;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(Math.cos(a2)*r*0.45, Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function sparkle4(x,y,r,col,alpha){
  ctx.save(); ctx.globalAlpha = alpha===undefined?1:alpha; ctx.fillStyle = col||'#fff';
  ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
  ctx.fill(); ctx.restore();
}

/* ---------------- player identity -------------------------- */
const NAME_KEY = 'mmmPlayerName';
let PLAYER_TAG = '';
try{

  if(qp) localStorage.setItem(NAME_KEY, qp.trim().slice(0,16));

/* ---------------- save data -------------------------------- */
const SAVE_KEY = 'muntahasMysteryMayhem.v1' + (PLAYER_TAG ? '.' + PLAYER_TAG : '');
const SAVE_DEFAULTS = {
  coins: 0,
  selected: 'custom',                 // which detective is active
  custom: { skin:2, hair:'ponytail', hairColor:'#4a3320', outfit:'trench',
            outfitColor:'#a78bfa', acc:'hat', accColor:'#ff8fc7', eyes:'sparkle', mouth:'smile' },
  creatorDone: false,
  unlocked: { custom:true, muntaha:true, anya:true },
  gear: {},                           // {magnifier:true, ...}
  levelReached: 1,
  solved: {},                         // {1:{firstTry:true, noHints:true}}
  pawprints: 0,                       // golden pawprints for Whiskers
  caseProg: null,                     // mid-case autosave
  tut: {},                            // tutorial flags shown
  musicMuted: false, sfxMuted: false,
  stats: { playSec: 0, casesSolved: 0 }
};
let save = JSON.parse(JSON.stringify(SAVE_DEFAULTS));
try{
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s && typeof s === 'object'){
    save = Object.assign(save, s);
    for(const k of ['custom','unlocked','gear','solved','tut','stats'])
      save[k] = Object.assign(JSON.parse(JSON.stringify(SAVE_DEFAULTS[k])), s[k]||{});
  }
}catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
window.addEventListener('pagehide', ()=>{ try{ persist(); }catch(e){} });

/* ============================================================
   SOUND — a tiny noir jazz trio (WebAudio, no files).
   Upright-bass plucks, brushed snare, celesta sparkle, and a
   soft echo like an empty office at night. The score is
   ADAPTIVE: during investigation it adds layers and picks up
   tempo with every clue found; the accusation gets a heartbeat.
   ============================================================ */
let AC = null, masterG = null, musBus = null, dlyIn = null, noiseBuf = null;
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      masterG = AC.createGain(); masterG.gain.value = 0.9; masterG.connect(AC.destination);
      musBus = AC.createGain(); musBus.gain.value = 1; musBus.connect(masterG);
      dlyIn = AC.createGain(); dlyIn.gain.value = 1;
      const d = AC.createDelay(1.0); d.delayTime.value = 0.26;
      const fb = AC.createGain(); fb.gain.value = 0.30;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
      dlyIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d);
      lp.connect(musBus);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const ch0 = noiseBuf.getChannelData(0);
      for(let i=0;i<ch0.length;i++) ch0[i] = Math.random()*2 - 1;
    }catch(e){}
  }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function n2f(m){ return 440 * Math.pow(2, (m - 69) / 12); }

/* ---- instruments (schedulable; when=0 means "now") ---- */
function voice(f, when, vol, dur, o){
  o = o || {};
  const ac = AC; if(!ac) return;
  const t = Math.max(when || 0, ac.currentTime);
  const osc = ac.createOscillator();
  osc.type = o.type || 'triangle';
  osc.frequency.setValueAtTime(f, t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f + o.slide), t + dur);
  const flt = ac.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.setValueAtTime(o.lpf || f*4, t);
  if(o.lpSlide) flt.frequency.exponentialRampToValueAtTime(Math.max(80, (o.lpf||f*4) + o.lpSlide), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.006));
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  osc.connect(flt); flt.connect(g); g.connect(musBus);
  if(o.echo){ const send = ac.createGain(); send.gain.value = o.echo; g.connect(send); send.connect(dlyIn); }
  if(o.det){
    const o2 = ac.createOscillator(); o2.type = 'sine';
    o2.frequency.setValueAtTime(f*o.det, t);
    o2.connect(flt); o2.start(t); o2.stop(t + dur + 0.05);
  }
  osc.start(t); osc.stop(t + dur + 0.05);
}
function brushHit(when, vol, o){
  o = o || {};
  const ac = AC; if(!ac || !noiseBuf) return;
  const t = Math.max(when || 0, ac.currentTime);
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  src.playbackRate.value = o.rate || 1;
  const flt = ac.createBiquadFilter();
  flt.type = o.type || 'highpass'; flt.frequency.value = o.freq || 5000;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0008, t + (o.dur || 0.07));
  src.connect(flt); flt.connect(g); g.connect(musBus);
  src.start(t); src.stop(t + (o.dur || 0.07) + 0.06);
}
function bassPluck(m, when, vol, dur){
  voice(n2f(m), when, vol, dur || 0.5, {type:'sine', lpf:n2f(m)*3, attack:0.008});
  voice(n2f(m)*2.01, when, vol*0.22, (dur || 0.5)*0.6, {type:'triangle', lpf:900});
}
function pizz(m, when, vol, dur){
  voice(n2f(m), when, vol, dur || 0.22, {type:'triangle', lpf:n2f(m)*2.6, lpSlide:-n2f(m)*1.3, attack:0.004, echo:0.22});
}
function celesta(m, when, vol, dur){
  voice(n2f(m), when, vol, dur || 0.9, {type:'sine', lpf:6500, attack:0.004, echo:0.5, det:2.004});
}

/* ---- SFX (diegetic; each checks the SFX mute) ---- */
function sfxOK(){ return !save.sfxMuted && !!audio(); }
const SFX = {
  click(){ if(!sfxOK())return; voice(1150, 0, 0.040, 0.06, {type:'triangle', lpf:2400}); },
  tap(){ if(!sfxOK())return; voice(620, 0, 0.07, 0.09, {type:'triangle', lpf:1600}); },
  pop(){ if(!sfxOK())return; voice(300, 0, 0.11, 0.12, {type:'sine', slide:230});
         brushHit(0, 0.05, {freq:2500, dur:0.05}); },
  dust(){ if(!sfxOK())return; brushHit(0, 0.05, {type:'lowpass', freq:650, dur:0.25, rate:0.5}); },
  fizzle(){ if(!sfxOK())return; brushHit(0, 0.035, {freq:6000, dur:0.16}); },
  chime(){ if(!sfxOK())return; const t = AC.currentTime;
    [86, 90, 93].forEach((m,i)=>celesta(m, t + i*0.09, 0.09, 0.9));
    brushHit(t, 0.02, {freq:8000, dur:0.2}); },
  coin(){ if(!sfxOK())return; const t = AC.currentTime;
    celesta(96, t, 0.075, 0.5); celesta(103, t + 0.07, 0.055, 0.6); },
  sting(){ if(!sfxOK())return; const t = AC.currentTime;
    voice(n2f(38), t, 0.15, 1.1, {type:'sawtooth', lpf:520, attack:0.01});
    voice(n2f(39), t, 0.11, 1.1, {type:'sawtooth', lpf:520, attack:0.01});
    brushHit(t, 0.08, {freq:3000, dur:0.5});
    voice(n2f(26), t + 0.26, 0.16, 1.2, {type:'sine', lpf:300}); },
  giggle(){ if(!sfxOK())return; const t = AC.currentTime;
    [81, 85, 81, 88].forEach((m,i)=>pizz(m, t + i*0.08, 0.07, 0.14)); },
  knock(){ if(!sfxOK())return; const t = AC.currentTime;
    brushHit(t, 0.22, {type:'lowpass', freq:180, dur:0.11, rate:0.4});
    brushHit(t + 0.19, 0.22, {type:'lowpass', freq:170, dur:0.11, rate:0.4}); },
  stamp(){ if(!sfxOK())return; voice(90, 0, 0.2, 0.25, {type:'sine', slide:-40});
    brushHit(0, 0.1, {type:'lowpass', freq:420, dur:0.12}); },
  whoosh(){ if(!sfxOK())return; brushHit(0, 0.05, {freq:900, dur:0.38, rate:0.7}); },
  ping(){ if(!sfxOK())return; celesta(100, 0, 0.045, 1.2); },
  fanfare(){ if(!sfxOK())return; const t = AC.currentTime;
    bassPluck(38, t, 0.12, 0.7);
    [81, 86, 90].forEach(m=>celesta(m, t + 0.03, 0.06, 1.0));
    [93, 98].forEach((m,i)=>celesta(m, t + 0.34 + i*0.09, 0.07, 1.2));
    brushHit(t + 0.34, 0.03, {freq:7000, dur:0.3}); },
  hmm(){ if(!sfxOK())return; pizz(64, 0, 0.08, 0.2);
    const t = AC.currentTime; pizz(62, t + 0.16, 0.08, 0.26); }
};

/* ---- the adaptive score ---- */
let music = { mood:null, step:0, next:0 };
function setMusic(mood){ if(music.mood !== mood){ music.mood = mood; music.step = 0; music.next = 0; } }
function musicIntensity(){
  if((state === 'scene' || state === 'talk') && cp){
    let n = 0;
    try{ n = Math.min(3, cluesFound() + (culpritCracked() ? 1 : 0)); }catch(e){}
    return n;
  }
  return 0;
}
function musicBPM(){
  if(music.mood === 'sleuth') return 88 + musicIntensity()*7;  /* tempo follows the case */
  if(music.mood === 'tense') return 66;
  return 76;                                                    /* noir lounge */
}
function scheduleStep(i, t){
  const m = music.mood, I = musicIntensity();
  if(m === 'tense'){
    const b = i % 16;
    if(b === 0) bassPluck(38, t, 0.13, 0.3);
    if(b === 3) bassPluck(38, t, 0.08, 0.22);
    if(b === 8) brushHit(t, 0.018, {type:'lowpass', freq:900, dur:0.8, rate:0.6});
    if(b === 14 && (Math.floor(i/16) % 2)) celesta(68, t, 0.03, 1.4);
    return;
  }
  if(m === 'sleuth'){
    const b = i % 16;
    const bl = [38,0,41,0, 44,0,45,0, 44,0,41,0, 38,0,36,0];   /* tip-toe chromatic climb */
    if(bl[b]) pizz(bl[b], t, 0.1, 0.3);
    brushHit(t, b % 4 === 2 ? 0.026 : 0.012, {freq:6000, dur:0.05});
    if(I >= 1 && b % 2 === 1) brushHit(t, 0.009, {freq:8500, dur:0.03});
    if(I >= 2){
      const ml = [0,0,74,0, 0,77,76,0, 0,81,80,0, 77,0,74,0];  /* sneaky chromatic neighbors */
      if(ml[b]) pizz(ml[b], t, 0.05, 0.2);
    }
    if(I >= 3 && b === 0) [62,65,69].forEach(n=>celesta(n, t, 0.028, 1.2));
    return;
  }
  /* cozy: slow noir lounge — walking bass, brushes, a lonely celesta */
  const b = i % 32;
  const bl = [38,0,0,0, 45,0,0,0, 41,0,0,0, 44,0,43,0, 38,0,0,0, 46,0,0,0, 43,0,0,0, 40,0,45,0];
  if(bl[b]) bassPluck(bl[b], t, 0.095, 0.55);
  if(b % 2 === 0) brushHit(t, b % 8 === 4 ? 0.024 : 0.011, {freq:5500, dur:0.06});
  const ml = [0,0,74,0, 0,77,76,0, 0,0,72,0, 0,0,0,0, 0,0,69,0, 0,70,69,0, 0,0,65,0, 0,0,62,0];
  if(ml[b] && (Math.floor(i/32) % 2 === 0)) celesta(ml[b], t, 0.042, 0.8);
}
function musicTick(){
  if(!AC || AC.state !== 'running' || save.musicMuted || !music.mood) return;
  const stepDur = 60 / musicBPM() / 2;
  if(!music.next || music.next < AC.currentTime - 0.5) music.next = AC.currentTime + 0.05;
  while(music.next < AC.currentTime + 0.30){
    scheduleStep(music.step, music.next);
    const sw = (music.mood === 'tense') ? 1 : (music.step % 2 === 0 ? 1.16 : 0.84);  /* swing */
    music.next += stepDur * sw;
    music.step++;
  }
}

/* ---------------- particles: sparkles / confetti / floaties - */
const ambient = [];
for(let i=0;i<26;i++) ambient.push({ x:Math.random()*W, y:Math.random()*H, ph:Math.random()*7, sp:0.4+Math.random()*0.9, r:1.5+Math.random()*2.6 });
function drawAmbientSparkles(){
  for(const a of ambient){
    const tw = (Math.sin(time*a.sp*2 + a.ph) + 1) / 2;
    sparkle4(a.x, (a.y + time*6*a.sp) % H, a.r*(0.6+tw), '#ffffff', 0.25 + tw*0.45);
  }
}
let confetti = [];
function burstConfetti(x, y, n){
  const cols = [C('pink'),C('purple'),C('blue'),C('gold'),C('mint'),'#fff'];
  for(let i=0;i<(n||60);i++){
    confetti.push({ x, y, vx:(Math.random()-0.5)*380, vy:-Math.random()*420-60,
      g:640, r:3+Math.random()*4, col:cols[i%cols.length], rot:Math.random()*7, vr:(Math.random()-0.5)*9, life:1.6+Math.random()*0.9 });
  }
}
function stepConfetti(dt){
  for(const c of confetti){ c.life-=dt; c.x+=c.vx*dt; c.vy+=c.g*dt; c.y+=c.vy*dt; c.rot+=c.vr*dt; }
  confetti = confetti.filter(c=>c.life>0 && c.y<H+30);
}
function drawConfetti(){
  for(const c of confetti){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.globalAlpha = Math.min(1,c.life);
    ctx.fillStyle = c.col; ctx.fillRect(-c.r,-c.r/2,c.r*2,c.r); ctx.restore();
  }
}
let floaties = [];
function floaty(text, x, y, col, size){ floaties.push({text,x,y,col:col||C('purpleDeep'),size:size||20,life:1.6}); }
function stepFloaties(dt){ for(const f of floaties){ f.life-=dt; f.y-=34*dt; } floaties = floaties.filter(f=>f.life>0); }
function drawFloaties(){ for(const f of floaties) txt(f.text, f.x, f.y, f.size, {color:f.col, bold:true, alpha:Math.min(1,f.life)}); }
let sparkBursts = [];
function sparkBurst(x,y,col,n){
  for(let i=0;i<(n||8);i++){
    const a = Math.random()*Math.PI*2, sp = 30+Math.random()*90;
    sparkBursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.5+Math.random()*0.4,col:col||'#fff',r:2+Math.random()*2.5});
  }
}
function stepSparkBursts(dt){ for(const s of sparkBursts){ s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; } sparkBursts = sparkBursts.filter(s=>s.life>0); }
function drawSparkBursts(){ for(const s of sparkBursts) sparkle4(s.x,s.y,s.r*(s.life*2),s.col,Math.min(1,s.life*2)); }

/* ---------------- transition wipe -------------------------- */
let trans = null;
function startTrans(mid){ trans = { t:0, mid, fired:false }; SFX.whoosh(); }
function stepDrawTrans(dt){
  if(!trans) return;
  trans.t += dt*2.4;
  const R = Math.hypot(W,H)/2 + 40;
  let r;
  if(trans.t < 1){ r = trans.t * R; }
  else {
    if(!trans.fired){ trans.fired = true; try{ trans.mid && trans.mid(); }catch(e){ console.error(e); } }
    r = Math.max(0, (2 - trans.t)) * R;
  }
  ctx.save();
  ctx.fillStyle = vGrad(0,0,H,'#ff9fd0','#a78bfa');
  ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, Math.PI*2); ctx.fill();
  if(r > 30){
    for(let i=0;i<10;i++){
      const a = i/10*Math.PI*2 + time*0.8;
      sparkle4(W/2+Math.cos(a)*r*0.8, H/2+Math.sin(a)*r*0.8, 6, '#fff', 0.8);
    }
  }
  ctx.restore();
  if(trans.t >= 2) trans = null;
}

/* ---------------- input ------------------------------------ */
let uiButtons = [];
let pointer = { down:false, x:0, y:0, sx:0, sy:0, dragged:false, moved:0 };
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
function drawButton(label, x, y, w, h, cb, o){
  o = o || {};
  const fill = o.fill || vGrad(x, y, h, o.c1 || '#ff9ed2', o.c2 || '#ff5fae');
  ctx.save();
  softShadow(true, 10);
  rr(x, y, w, h, o.r === undefined ? h/2 : o.r);
  ctx.fillStyle = o.disabled ? '#d8d0e8' : fill; ctx.fill();
  softShadow(false);
  // bottom candy edge
  rr(x, y+h-5, w, 5, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fill();
  // top gloss
  rr(x+6, y+4, w-12, h*0.36, h*0.2);
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
  ctx.restore();
  txt(label, x+w/2, y+h/2 - 1, o.size || 20, {bold:true, color: o.disabled ? '#a49bc0' : (o.ink || '#fff')});
  if(!o.disabled) uiButtons.push({x, y, w, h, cb});
  else if(o.disabledCb) uiButtons.push({x, y, w, h, cb:o.disabledCb});
}
function hitButtons(p){
  for(let i=uiButtons.length-1;i>=0;i--){
    const b = uiButtons[i];
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ SFX.click(); b.cb(); return true; }
  }
  return false;
}
window.addEventListener('pointerdown', e=>{
  audio();
  const p = toCanvas(e);
  pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  pointer.sx = p.x; pointer.sy = p.y; pointer.dragged = false; pointer.moved = 0;
  onPointerDown(p);
});
window.addEventListener('pointermove', e=>{
  if(!pointer.down) return;
  const p = toCanvas(e);
  const dx = p.x - pointer.x, dy = p.y - pointer.y;
  pointer.moved += Math.abs(dx) + Math.abs(dy);
  if(pointer.moved > 12) pointer.dragged = true;
  onPointerDrag(p, dx, dy);
  pointer.x = p.x; pointer.y = p.y;
});
window.addEventListener('pointerup', e=>{
  if(!pointer.down) return;
  pointer.down = false;
  onPointerUp({x:pointer.x, y:pointer.y}, pointer.dragged);
});
window.addEventListener('pointercancel', ()=>{ pointer.down = false; });

const OUTFITNAMES = {trench:'Trench Coat', dress:'Twirl Dress', hoodie:'Hoodie + Skirt', overalls:'Overalls', sweater:'Cozy Sweater', sparkle:'Sparkle Top', shalwar:'Shalwar Kameez'};
const OUTFITCOLORS = ['#ff8fc7','#e2699e','#a78bfa','#7c5cbf','#7cc4ff','#5a8fd8','#8fe3c0','#ffd166'];

const MOUTHSTYLES = ['smile','grin','tiny','cat','shy'];

function shade(hex, f){
  if(!hex || hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0,Math.min(255, Math.round(r*f)));
  g = Math.max(0,Math.min(255, Math.round(g*f)));
  b = Math.max(0,Math.min(255, Math.round(b*f)));
  return 'rgb('+r+','+g+','+b+')';
}

/* ============================================================
   CHARACTER ART v2 — candy-gloss, always front-facing.
   Layering: hairBehind → legs → body → arms → neck → head.
   Long styles fall BEHIND the shoulders, never around the chin.
   ============================================================ */

/* hair masses that hang below the chin — drawn BEFORE the body */
function drawHairBehind(x, hy, r, ch, o){
  o = o || {};
  const hc = ch.hairColor || '#4a3320', hs = ch.hair;
  const sway = Math.sin(time*1.6 + (o.ph||0));
  ctx.fillStyle = hc;
  if(hs === 'long' || hs === 'wavy'){
    for(const g of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x+g*r*0.55, hy-r*0.55);
      ctx.quadraticCurveTo(x+g*r*1.42, hy+r*0.9, x+g*r*1.18 + sway*g*1.5, hy+r*2.6);
      ctx.quadraticCurveTo(x+g*r*1.02, hy+r*3.1, x+g*r*0.62, hy+r*2.85);
      ctx.quadraticCurveTo(x+g*r*0.88, hy+r*1.5, x+g*r*0.5, hy+r*0.2);
      ctx.closePath(); ctx.fill();
      if(hs === 'wavy'){
        ell(x+g*r*1.0 + sway*g, hy+r*2.55, r*0.32, r*0.36, hc);
        ell(x+g*r*0.64, hy+r*2.82, r*0.26, r*0.30, hc);
      }
    }
  } else if(hs === 'ponytail'){
    ctx.save();
    ctx.translate(x+r*1.0, hy-r*0.45);
    ctx.rotate(0.82 + sway*0.06);
    ctx.beginPath();
    ctx.moveTo(-r*0.12, -r*0.1);
    ctx.quadraticCurveTo(r*1.35, r*0.75, r*0.9, r*2.2);
    ctx.quadraticCurveTo(r*0.66, r*2.72, r*0.34, r*2.24);
    ctx.quadraticCurveTo(r*0.5, r*1.15, -r*0.14, r*0.38);
    ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
    /* gloss streak on the tail */
    ctx.globalAlpha = 0.28; ctx.strokeStyle = '#fff'; ctx.lineWidth = r*0.13; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(r*0.55, r*0.55); ctx.quadraticCurveTo(r*0.95, r*1.1, r*0.72, r*1.9); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  } else if(hs === 'pigtails'){
    for(const g of [-1,1]){
      ctx.save();
      ctx.translate(x+g*r*1.02, hy-r*0.15);
      ctx.rotate(g*(0.30 + sway*0.05));
      ctx.beginPath();
      ctx.moveTo(0, -r*0.15);
      ctx.quadraticCurveTo(g*r*0.78, r*0.5, g*r*0.44, r*1.55);
      ctx.quadraticCurveTo(g*r*0.1, r*2.0, -g*r*0.2, r*1.5);
      ctx.quadraticCurveTo(-g*r*0.08, r*0.55, 0, -r*0.15);
      ctx.closePath(); ctx.fillStyle = hc; ctx.fill();
      ctx.restore();
    }
  } else if(hs === 'braids'){
    for(const g of [-1,1]){
      for(let i=0;i<4;i++){
        ell(x+g*(r*0.92 + i*r*0.06), hy + r*(0.35 + i*0.5), r*(0.30 - i*0.03), r*0.30, hc);
      }
      ell(x+g*r*1.1, hy+r*2.3, r*0.13, r*0.17, C('pink'));
    }
  }
}

/* head + face + hair top — centered at (x,y), head radius r */
function drawHead(x, y, r, ch, mood, o){
  o = o || {};
  const hc = ch.hairColor || '#4a3320';
  const skin = SKINS[ch.skin] || SKINS[2];
  const hs = ch.hair;
  ctx.save();
  /* hair mass at head height (never below the chin) */
  ctx.fillStyle = hc;
  if(hs === 'bob'){
    ctx.beginPath();
    ctx.moveTo(x-r*1.18, y+r*0.6);
    ctx.quadraticCurveTo(x-r*1.32, y-r*1.02, x, y-r*1.16);
    ctx.quadraticCurveTo(x+r*1.32, y-r*1.02, x+r*1.18, y+r*0.6);
    ctx.quadraticCurveTo(x+r*0.95, y+r*0.9, x+r*0.8, y+r*0.5);
    ctx.lineTo(x-r*0.8, y+r*0.5);
    ctx.quadraticCurveTo(x-r*0.95, y+r*0.9, x-r*1.18, y+r*0.6);
    ctx.closePath(); ctx.fill();
  } else if(hs === 'curly'){
    for(let i=0;i<8;i++){
      const a = Math.PI*(1.05 - i*0.157);
      ell(x+Math.cos(a)*r*1.0, y-r*0.08 - Math.sin(a)*r*0.92, r*0.46, r*0.46, hc);
    }
    ell(x-r*1.0, y+r*0.34, r*0.4, r*0.44, hc);
    ell(x+r*1.0, y+r*0.34, r*0.4, r*0.44, hc);
  } else if(hs === 'buns'){
    for(const g of [-1,1]){
      ell(x+g*r*0.8, y-r*1.0, r*0.46, r*0.46, hc);
      ell(x+g*r*0.68, y-r*1.14, r*0.15, r*0.12, 'rgba(255,255,255,0.5)');
    }
  } else {
    /* long / wavy / ponytail / pigtails / braids: side volume by the ears */
    ell(x-r*0.95, y-r*0.05, r*0.34, r*0.62, hc);
    ell(x+r*0.95, y-r*0.05, r*0.34, r*0.62, hc);
  }
  /* head */
  softShadow(true, 7);
  ell(x, y, r*(ch.boy?1.06:1), r*1.05, skin);
  softShadow(false);
  ell(x-r*0.99, y+r*0.08, r*0.14, r*0.22, skin);
  ell(x+r*0.99, y+r*0.08, r*0.14, r*0.22, skin);
  /* ---- face ---- */
  const ex = r*0.42, ey = y + r*0.02;
  const m = mood || 'smile';
  const es = ch.eyes || 'sparkle', ms = ch.mouth || 'smile';
  if(m === 'happy' || m === 'giggle'){
    ctx.strokeStyle = '#3a3048'; ctx.lineWidth = r*0.1; ctx.lineCap = 'round';
    for(const g of [-1,1]){ ctx.beginPath(); ctx.arc(x+g*ex, ey+r*0.08, r*0.17, Math.PI*1.12, Math.PI*1.88); ctx.stroke(); }
  } else if(m === 'cracked' || m === 'shock'){
    for(const g of [-1,1]){
      ell(x+g*ex, ey, r*0.19, r*0.21, '#fff');
      ell(x+g*ex, ey, r*0.08, r*0.09, '#3a3048');
    }
  } else if(m === 'sad'){
    for(const g of [-1,1]){ ell(x+g*ex, ey+r*0.05, r*0.1, r*0.12, '#3a3048'); }
    ctx.strokeStyle = '#3a3048'; ctx.lineWidth = r*0.06; ctx.lineCap = 'round';
    for(const g of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+g*ex-r*0.14*g, ey-r*0.24); ctx.lineTo(x+g*ex+r*0.16*g, ey-r*0.32); ctx.stroke(); }
  } else {
    const blink = (Math.sin(time*1.7 + (o.ph||0)*3) > 0.985);
    for(const g of [-1,1]){
      if(blink){
        ctx.strokeStyle = '#3a3048'; ctx.lineWidth = r*0.08; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x+g*ex-r*0.11, ey); ctx.lineTo(x+g*ex+r*0.11, ey); ctx.stroke();
      } else if(es === 'round'){
        ell(x+g*ex, ey, r*0.16, r*0.19, '#3a3048');
        ell(x+g*ex - r*0.055, ey - r*0.07, r*0.06, r*0.07, '#fff');
        if(!ch.boy) ell(x+g*ex + r*0.06, ey + r*0.05, r*0.025, r*0.03, 'rgba(255,255,255,0.85)');
      } else if(es === 'sleepy'){
        ell(x+g*ex, ey+r*0.01, r*0.125, r*0.13, '#3a3048');
        ell(x+g*ex, ey - r*0.1, r*0.16, r*0.1, skin);
        ctx.strokeStyle = '#3a3048'; ctx.lineWidth = r*0.055; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(x+g*ex, ey - r*0.015, r*0.14, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
        ell(x+g*ex + r*0.04, ey + r*0.03, r*0.03, r*0.035, '#fff');
      } else if(es === 'starry'){
        ell(x+g*ex, ey, r*0.14, r*0.17, '#3a3048');
        star(x+g*ex, ey, r*0.085, '#ffd166', 0.3);
      } else if(es === 'gentle'){
        ell(x+g*ex, ey, r*0.115, r*0.15, '#3a3048');
        ell(x+g*ex - r*0.035, ey - r*0.05, r*0.045, r*0.05, '#fff');
        ctx.strokeStyle = '#3a3048'; ctx.lineWidth = r*0.045; ctx.lineCap='round';
        for(let li=0; li<2; li++){
          ctx.beginPath();
          ctx.moveTo(x+g*(ex + r*0.1), ey - r*(0.1 + li*0.05));
          ctx.lineTo(x+g*(ex + r*0.2), ey - r*(0.16 + li*0.07));
          ctx.stroke();
        }
        } else { /* sparkle */
        ell(x+g*ex, ey, r*0.125, r*0.16, '#3a3048');
        ell(x+g*ex - r*0.045, ey - r*0.055, r*0.048, r*0.058, '#fff');
        if(!ch.boy) ell(x+g*ex + r*0.05, ey + r*0.04, r*0.022, r*0.026, 'rgba(255,255,255,0.85)');
      }
    }
  }
  /* boy brows: short, flat, serious */
  if(ch.boy && m !== 'cracked' && m !== 'shock'){
    ctx.strokeStyle = shade(ch.hairColor || '#4a3320', 0.75);
    ctx.lineWidth = r*0.07; ctx.lineCap = 'round';
    for(const g of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x+g*ex - r*0.12, ey - r*0.26);
      ctx.lineTo(x+g*ex + r*0.12, ey - r*0.27);
      ctx.stroke();
    }
  }
  /* mouth */
  ctx.strokeStyle = '#c25a78'; ctx.lineWidth = r*0.085; ctx.lineCap = 'round';
  if(m === 'ooh' || m === 'shock'){ ell(x, y+r*0.44, r*0.12, r*0.16, '#c25a78'); ell(x, y+r*0.40, r*0.07, r*0.06, '#8d3d55'); }
  else if(m === 'sad'){ ctx.beginPath(); ctx.arc(x, y+r*0.58, r*0.18, Math.PI*1.15, Math.PI*1.85); ctx.stroke(); }
  else if(m === 'nervous'){ ctx.beginPath(); ctx.moveTo(x-r*0.2, y+r*0.44);
    ctx.quadraticCurveTo(x-r*0.08, y+r*0.36, x, y+r*0.44); ctx.quadraticCurveTo(x+r*0.08, y+r*0.52, x+r*0.2, y+r*0.44); ctx.stroke(); }
  else if(m === 'cracked'){ ell(x, y+r*0.46, r*0.17, r*0.21, '#8d3d55'); ell(x, y+r*0.54, r*0.11, r*0.08, '#e78fa5'); }
  else if(m === 'giggle'){ ctx.beginPath(); ctx.arc(x, y+r*0.3, r*0.25, Math.PI*0.1, Math.PI*0.9); ctx.stroke();
    ell(x, y+r*0.48, r*0.13, r*0.08, '#e78fa5'); }
  else if(ms === 'grin'){
    ctx.beginPath(); ctx.arc(x, y+r*0.32, r*0.22, Math.PI*0.08, Math.PI*0.92); ctx.closePath();
    ctx.fillStyle = '#8d3d55'; ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x-r*0.17, y+r*0.345, r*0.34, r*0.07);
    ctx.beginPath(); ctx.arc(x, y+r*0.32, r*0.22, Math.PI*0.08, Math.PI*0.92); ctx.stroke();
  }
  else if(ms === 'tiny'){ ell(x, y+r*0.42, r*0.07, r*0.05, '#c25a78'); }
  else if(ms === 'cat'){
    ctx.lineWidth = r*0.07;
    ctx.beginPath(); ctx.arc(x-r*0.1, y+r*0.36, r*0.1, Math.PI*0.1, Math.PI*0.95); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+r*0.1, y+r*0.36, r*0.1, Math.PI*0.05, Math.PI*0.9); ctx.stroke();
  }
  else if(ms === 'shy'){
    ctx.lineWidth = r*0.06;
    ctx.beginPath(); ctx.moveTo(x-r*0.12, y+r*0.42);
    ctx.quadraticCurveTo(x, y+r*0.47, x+r*0.12, y+r*0.42); ctx.stroke();
  }
  else { ctx.beginPath(); ctx.arc(x, y+r*0.3, r*0.21, Math.PI*0.15, Math.PI*0.85); ctx.stroke(); }
  /* mustache (grown men) */
  if(ch.mustache){
    ctx.strokeStyle = ch.mustache; ctx.lineWidth = r*0.11; ctx.lineCap = 'round';
    for(const g of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(x, y+r*0.24);
      ctx.quadraticCurveTo(x+g*r*0.2, y+r*0.18, x+g*r*0.32, y+r*0.24);
      ctx.quadraticCurveTo(x+g*r*0.4, y+r*0.28, x+g*r*0.38, y+r*0.14);
      ctx.stroke();
    }
  }
  /* blush with a glint (girls only) */
  if(!ch.boy){
    for(const g of [-1,1]){
      ell(x+g*r*0.63, y+r*0.3, r*0.15, r*0.1, 'rgba(255,110,165,0.38)');
      ell(x+g*r*0.58, y+r*0.27, r*0.045, r*0.03, 'rgba(255,255,255,0.6)');
    }
  }
  /* sweat drops */
  if(m === 'nervous' || m === 'cracked'){
    const dy = (time*40 % 14);
    ell(x+r*0.95, y-r*0.5+dy*0.4, r*0.09, r*0.13, '#9fd8ff');
    if(m === 'cracked') ell(x-r*0.98, y-r*0.35+dy*0.3, r*0.08, r*0.11, '#9fd8ff');
  }
  /* ---- bangs: soft scalloped fringe, top third only ---- */
  ctx.fillStyle = hc;
  ctx.beginPath();
  ctx.moveTo(x-r*1.04, y-r*0.05);
  ctx.quadraticCurveTo(x-r*1.12, y-r*1.18, x, y-r*1.16);
  ctx.quadraticCurveTo(x+r*1.12, y-r*1.18, x+r*1.04, y-r*0.05);
  ctx.quadraticCurveTo(x+r*0.98, y-r*0.48, x+r*0.78, y-r*0.6);
  ctx.quadraticCurveTo(x+r*0.55, y-r*0.30, x+r*0.28, y-r*0.55);
  ctx.quadraticCurveTo(x+r*0.02, y-r*0.30, x-r*0.26, y-r*0.55);
  ctx.quadraticCurveTo(x-r*0.52, y-r*0.30, x-r*0.76, y-r*0.58);
  ctx.quadraticCurveTo(x-r*0.95, y-r*0.48, x-r*1.04, y-r*0.05);
  ctx.closePath(); ctx.fill();
  /* candy-gloss hair shine */
  ctx.save(); ctx.globalAlpha = 0.30; ctx.strokeStyle = '#fff';
  ctx.lineWidth = r*0.15; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y-r*0.22, r*0.74, Math.PI*1.2, Math.PI*1.52); ctx.stroke();
  ctx.restore();
  /* ponytail / pigtail ties on top of the bangs */
  if(hs === 'ponytail') ell(x+r*0.95, y-r*0.5, r*0.19, r*0.19, C('gold'));
  if(hs === 'pigtails'){ ell(x-r*0.98, y-r*0.24, r*0.16, r*0.16, C('gold')); ell(x+r*0.98, y-r*0.24, r*0.16, r*0.16, C('gold')); }
  /* ---- accessory ---- */
  const acc = ch.acc, acl = (ch.accColor && ch.accColor[0]==='#') ? ch.accColor : C('pink');
  if(acc === 'hat'){
    ell(x, y-r*0.88, r*1.18, r*0.3, acl);
    ctx.fillStyle = acl;
    ctx.beginPath(); ctx.moveTo(x-r*0.95, y-r*0.92);
    ctx.quadraticCurveTo(x, y-r*1.85, x+r*0.95, y-r*0.92); ctx.closePath(); ctx.fill();
    fillRR(x-r*0.98, y-r*1.06, r*1.96, r*0.28, r*0.14, shade(acl, 0.78));
    ctx.save(); ctx.globalAlpha = 0.3; ctx.strokeStyle='#fff'; ctx.lineWidth=r*0.09; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x, y-r*1.02, r*0.46, Math.PI*1.2, Math.PI*1.55); ctx.stroke(); ctx.restore();
  } else if(acc === 'bow'){
    const bx2 = x-r*0.62, by2 = y-r*0.95;
    ell(bx2-r*0.28, by2, r*0.27, r*0.19, acl); ell(bx2+r*0.28, by2, r*0.27, r*0.19, acl);
    ell(bx2, by2, r*0.13, r*0.13, shade(acl, 0.78));
    ell(bx2-r*0.3, by2-r*0.06, r*0.09, r*0.05, 'rgba(255,255,255,0.55)');
  } else if(acc === 'headband'){
    ctx.strokeStyle = acl; ctx.lineWidth = r*0.16;
    ctx.beginPath(); ctx.arc(x, y-r*0.12, r*1.0, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ell(x+r*0.5, y-r*0.98, r*0.09, r*0.09, 'rgba(255,255,255,0.7)');
  } else if(acc === 'glasses'){
    ctx.strokeStyle = acl; ctx.lineWidth = r*0.07;
    for(const g of [-1,1]){ ctx.beginPath(); ctx.arc(x+g*ex, ey, r*0.27, 0, Math.PI*2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x-ex+r*0.27, ey); ctx.lineTo(x+ex-r*0.27, ey); ctx.stroke();
  } else if(acc === 'flower'){
    const fx = x+r*0.68, fy = y-r*0.88;
    for(let i=0;i<6;i++){ const a = i/6*Math.PI*2; ell(fx+Math.cos(a)*r*0.17, fy+Math.sin(a)*r*0.17, r*0.12, r*0.12, acl); }
    ell(fx, fy, r*0.1, r*0.1, C('gold'));
  }
  ctx.restore();
}

/* full body, feet at (x,y), always front-facing. o={mood,pose,grown,ph,walk,still} */
function drawDetective(x, y, ch, s, o){
  o = o || {};
  const grown = o.grown ? 1.26 : 1;
  const u = s;
  const skin = SKINS[ch.skin] || SKINS[2];
  const oc = ch.outfitColor || C('purple');
  const of = ch.outfit;
  const legL = 43*u*grown, bodyH = 60*u*grown, headR = 26.5*u;
  const hipY = y - legL, shY = hipY - bodyH, headY = shY - headR*0.80;
  const bob = o.still ? 0 : Math.sin(time*2.2 + (o.ph||0))*1.8*u;
  const hy = headY + bob;
  const walk = o.walk ? Math.sin(time*9)*6*u : 0;
  ctx.save();
  /* ground shadow */
  ell(x, y+3*u, 32*u*grown, 7.5*u, 'rgba(140,40,110,0.16)');
  /* hair that hangs below the chin goes BEHIND everything */
  drawHairBehind(x, hy, headR, ch, o);
  /* hips + legs — a lower garment ALWAYS covers the hip zone (no gaps, ever) */
  const legCol = (of==='overalls'||of==='hoodie') ? shade(oc,0.72)
               : (of==='sweater') ? shade(oc,0.55)
               : (of==='shalwar') ? shade(oc,1.45) : skin;
  const hipCol = (of==='sweater') ? shade(oc,0.55)
               : (of==='overalls'||of==='hoodie') ? shade(oc,0.72)
               : (of==='shalwar') ? shade(oc,1.45)
               : shade(oc,0.8);
  fillRR(x-15*u, hipY-20*u, 30*u, 34*u, 9*u, hipCol);
  ctx.lineCap = 'round';
  ctx.strokeStyle = legCol; ctx.lineWidth = (of==='shalwar' ? 13 : 10.5)*u;
  ctx.beginPath(); ctx.moveTo(x-9*u, hipY+10*u); ctx.lineTo(x-10*u, y-8*u+walk*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+9*u, hipY+10*u); ctx.lineTo(x+10*u, y-8*u-walk*0.4); ctx.stroke();
  if(of==='shalwar'){ /* ankle gathers */
    ell(x-10*u, y-9*u+walk*0.4, 7.5*u, 4*u, shade(oc,1.2));
    ell(x+10*u, y-9*u-walk*0.4, 7.5*u, 4*u, shade(oc,1.2));
  }
  /* glossy mary-jane shoes */
  for(const g of [-1,1]){
    const sy2 = y-4*u + walk*0.4*(-g);
    ell(x+g*11*u, sy2, 10*u, 6.5*u, '#fff');
    ell(x+g*11*u, sy2-2*u, 10*u, 5*u, C('pinkDeep'));
    ell(x+g*13*u, sy2-4.5*u, 2.4*u, 1.6*u, 'rgba(255,255,255,0.85)');
  }
  /* ---- body / outfit (gradient + gloss) ---- */
  const og = vGrad(x, shY, bodyH+16*u, shade(oc,1.16), shade(oc,0.84));
  softShadow(true, 6);
  if(of === 'trench'){
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.moveTo(x-20*u, shY+4*u);
    ctx.lineTo(x-28*u, hipY+16*u); ctx.lineTo(x+28*u, hipY+16*u); ctx.lineTo(x+20*u, shY+4*u);
    ctx.closePath(); ctx.fill();
    softShadow(false);
    fillRR(x-23*u, shY+bodyH*0.42, 46*u, 7*u, 3.5*u, shade(oc,0.70));
    ell(x, shY+bodyH*0.455, 4.5*u, 4.5*u, C('gold'));
    quadf(x-2*u,shY+5*u, x-11*u,shY+2*u, x-7*u,shY+15*u, x-2*u,shY+11*u, shade(oc,1.28));
    quadf(x+2*u,shY+5*u, x+11*u,shY+2*u, x+7*u,shY+15*u, x+2*u,shY+11*u, shade(oc,1.28));
    ell(x, shY+bodyH*0.62, 2.5*u, 2.5*u, shade(oc,0.6));
    ell(x, shY+bodyH*0.78, 2.5*u, 2.5*u, shade(oc,0.6));
  } else if(of === 'dress'){
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.moveTo(x-15*u, shY+4*u);
    ctx.quadraticCurveTo(x-35*u, hipY+10*u, x-31*u, hipY+14*u);
    ctx.lineTo(x+31*u, hipY+14*u);
    ctx.quadraticCurveTo(x+35*u, hipY+10*u, x+15*u, shY+4*u);
    ctx.closePath(); ctx.fill();
    softShadow(false);
    for(let i=0;i<4;i++) ell(x-21*u+i*14*u, hipY+13*u, 7*u, 4*u, shade(oc,1.18));
    ell(x-16*u, shY+7*u, 7*u, 6*u, shade(oc,1.18)); ell(x+16*u, shY+7*u, 7*u, 6*u, shade(oc,1.18));
    fillRR(x-6*u, shY+10*u, 12*u, 4*u, 2*u, '#fff');
  } else if(of === 'hoodie'){
    ctx.fillStyle = og;
    rr(x-19*u, shY+2*u, 38*u, bodyH*0.62, 10*u); ctx.fill();
    softShadow(false);
    ctx.beginPath(); ctx.moveTo(x-26*u, hipY+2*u); ctx.lineTo(x+26*u, hipY+2*u);
    ctx.lineTo(x+21*u, hipY+15*u); ctx.lineTo(x-21*u, hipY+15*u); ctx.closePath();
    ctx.fillStyle = shade(oc,0.72); ctx.fill();
    fillRR(x-9*u, shY+bodyH*0.36, 18*u, 10*u, 4*u, shade(oc,0.85));
    ell(x-9*u, shY+4*u, 5*u, 4*u, shade(oc,1.25)); ell(x+9*u, shY+4*u, 5*u, 4*u, shade(oc,1.25));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6*u;
    ctx.beginPath(); ctx.moveTo(x-4*u,shY+9*u); ctx.lineTo(x-4*u,shY+16*u);
    ctx.moveTo(x+4*u,shY+9*u); ctx.lineTo(x+4*u,shY+16*u); ctx.stroke();
  } else if(of === 'overalls'){
    fillRR(x-17*u, shY+2*u, 34*u, 16*u, 6*u, '#fff');
    softShadow(false);
    ctx.fillStyle = og;
    rr(x-19*u, shY+14*u, 38*u, bodyH-4*u, 8*u); ctx.fill();
    fillRR(x-11*u, shY+6*u, 22*u, 16*u, 4*u, shade(oc,1.05));
    ctx.strokeStyle = shade(oc,1.05); ctx.lineWidth = 4*u;
    ctx.beginPath(); ctx.moveTo(x-10*u, shY+7*u); ctx.lineTo(x-16*u, shY+2*u);
    ctx.moveTo(x+10*u, shY+7*u); ctx.lineTo(x+16*u, shY+2*u); ctx.stroke();
    ell(x-8*u, shY+9*u, 2.2*u, 2.2*u, C('gold')); ell(x+8*u, shY+9*u, 2.2*u, 2.2*u, C('gold'));
    fillRR(x-8*u, shY+20*u, 16*u, 11*u, 3*u, shade(oc,0.85));
  } else if(of === 'sweater'){
    ctx.fillStyle = og;
    rr(x-20*u, shY+2*u, 40*u, bodyH*0.72, 12*u); ctx.fill();
    softShadow(false);
    for(let i=0;i<3;i++){ ctx.strokeStyle = shade(oc,1.18); ctx.lineWidth = 2*u;
      ctx.beginPath(); ctx.moveTo(x-18*u, shY+12*u+i*10*u); ctx.lineTo(x+18*u, shY+12*u+i*10*u); ctx.stroke(); }
    fillRR(x-20*u, shY+bodyH*0.66, 40*u, 6*u, 3*u, shade(oc,0.8));
  } else if(of === 'shalwar'){
    /* long kameez to below the hips */
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.moveTo(x-17*u, shY+3*u);
    ctx.lineTo(x-23*u, hipY+26*u); ctx.lineTo(x+23*u, hipY+26*u); ctx.lineTo(x+17*u, shY+3*u);
    ctx.closePath(); ctx.fill();
    softShadow(false);
    fillRR(x-23*u, hipY+22*u, 46*u, 5*u, 2.5*u, shade(oc,1.22));
    ctx.strokeStyle = shade(oc,0.8); ctx.lineWidth = 1.6*u;
    ctx.beginPath(); ctx.moveTo(x-21*u, hipY+12*u); ctx.lineTo(x-22.5*u, hipY+24*u);
    ctx.moveTo(x+21*u, hipY+12*u); ctx.lineTo(x+22.5*u, hipY+24*u); ctx.stroke();
    ell(x, shY+9*u, 6*u, 4.5*u, shade(oc,1.28));
    ell(x, shY+9*u, 3.5*u, 2.6*u, oc);
    const dp = (ch.accColor && ch.accColor[0]==='#') ? ch.accColor : C('gold');
    ctx.save(); ctx.globalAlpha = 0.92;
    quadf(x+9*u, shY+2*u, x+19*u, shY+7*u, x-14*u, hipY+8*u, x-22*u, hipY+1*u, dp);
    ell(x+15*u, shY+6*u, 6*u, 4*u, dp);
    ctx.globalAlpha = 0.5;
    quadf(x+11*u, shY+4*u, x+15*u, shY+6*u, x-16*u, hipY+5*u, x-19*u, hipY+3*u, '#fff');
    ctx.restore();
  } else { /* sparkle */
    ctx.fillStyle = og;
    rr(x-17*u, shY+2*u, 34*u, bodyH*0.55, 9*u); ctx.fill();
    softShadow(false);
    ctx.beginPath(); ctx.moveTo(x-24*u, hipY+4*u); ctx.lineTo(x+24*u, hipY+4*u);
    ctx.lineTo(x+19*u, hipY+16*u); ctx.lineTo(x-19*u, hipY+16*u); ctx.closePath();
    ctx.fillStyle = C('purplePale'); ctx.fill();
    for(let i=0;i<6;i++){
      const sx2 = x-14*u + ((i*53)%28)*u, sy3 = shY+8*u + ((i*37)%26)*u;
      sparkle4(sx2, sy3, 2.6*u, '#fff', 0.6 + Math.sin(time*3+i)*0.35);
    }
  }
  /* candy gloss streak on the torso */
  ctx.save(); ctx.globalAlpha = 0.16;
  fillRR(x-15*u, shY+7*u, 8*u, bodyH*0.44, 4*u, '#fff');
  ctx.restore();
  /* ---- arms ---- */
  ctx.strokeStyle = (of==='dress'||of==='sparkle'||of==='overalls') ? skin
                  : (of==='trench') ? shade(oc,1.02) : oc;
  if(of==='shalwar') ctx.strokeStyle = oc;
  ctx.lineWidth = 9*u; ctx.lineCap = 'round';
  const armY = shY + 10*u;
  if(o.pose === 'point'){
    ctx.beginPath(); ctx.moveTo(x-16*u, armY); ctx.lineTo(x-24*u, hipY-6*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+16*u, armY); ctx.lineTo(x+34*u, armY-14*u); ctx.stroke();
    ell(x+37*u, armY-16*u, 5.5*u, 5.5*u, skin);
    ell(x-25*u, hipY-4*u, 5.5*u, 5.5*u, skin);
  } else if(o.pose === 'think'){
    ctx.beginPath(); ctx.moveTo(x-16*u, armY); ctx.lineTo(x-24*u, hipY-6*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+16*u, armY); ctx.lineTo(x+20*u, shY-4*u); ctx.stroke();
    ell(x+20*u, shY-8*u, 5.5*u, 5.5*u, skin);
    ell(x-25*u, hipY-4*u, 5.5*u, 5.5*u, skin);
  } else {
    const sway2 = Math.sin(time*2 + (o.ph||0)) * 2*u;
    ctx.beginPath(); ctx.moveTo(x-16*u, armY); ctx.lineTo(x-22*u+sway2*0.4, hipY-2*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+16*u, armY); ctx.lineTo(x+22*u-sway2*0.4, hipY-2*u); ctx.stroke();
    ell(x-22*u+sway2*0.4, hipY, 5.5*u, 5.5*u, skin);
    ell(x+22*u-sway2*0.4, hipY, 5.5*u, 5.5*u, skin);
  }
  /* neck + head */
  fillRR(x-4*u, headY+headR*0.7, 8*u, 10*u, 3*u, skin);
  drawHead(x, hy, headR, ch, o.mood, {ph:o.ph});
  ctx.restore();
}

/* front-facing cat detective (Whiskers) — feet at (x,y) */
function drawCritter(x, y, kind, s, o){
  o = o || {};
  const u = s;
  ctx.save();
  ell(x, y+2*u, 26*u, 7*u, 'rgba(74,59,99,0.18)');
  if(kind === 'cat'){
    const fur = '#e8a45e', fur2 = '#d18a44';
    ell(x, y-26*u, 20*u, 22*u, fur);                       // body
    ell(x, y-18*u, 12*u, 13*u, '#fff4e0');                 // tummy
    ell(x-13*u, y-4*u, 7*u, 5*u, fur); ell(x+13*u, y-4*u, 7*u, 5*u, fur);   // paws
    ctx.save(); ctx.translate(x+20*u, y-16*u); ctx.rotate(Math.sin(time*2)*0.15);
    ell(0, -12*u, 5*u, 16*u, fur2); ctx.restore();          // tail
    const hy = y-52*u;
    ell(x, hy, 17*u, 15*u, fur);                            // head
    ctx.beginPath(); ctx.moveTo(x-14*u,hy-6*u); ctx.lineTo(x-8*u,hy-20*u); ctx.lineTo(x-3*u,hy-10*u); ctx.closePath(); ctx.fillStyle=fur; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+14*u,hy-6*u); ctx.lineTo(x+8*u,hy-20*u); ctx.lineTo(x+3*u,hy-10*u); ctx.closePath(); ctx.fill();
    ell(x-7*u, hy-1*u, 2.6*u, 3.2*u, '#3a3048'); ell(x+7*u, hy-1*u, 2.6*u, 3.2*u, '#3a3048');
    ell(x-6.2*u, hy-2*u, 0.9*u, 1*u, '#fff'); ell(x+7.8*u, hy-2*u, 0.9*u, 1*u, '#fff');
    ell(x, hy+4*u, 2.4*u, 1.8*u, '#e2699e');                // nose
    ctx.strokeStyle = '#3a3048'; ctx.lineWidth = 0.8*u;
    for(const sgn of [-1,1]) for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(x+sgn*4*u, hy+4*u+i*1.4*u-1.4*u);
      ctx.lineTo(x+sgn*16*u, hy+2*u+i*2.6*u-2.6*u); ctx.stroke();
    }
    /* tiny detective hat */
    ell(x, hy-13*u, 13*u, 3.4*u, C('purple'));
    ctx.beginPath(); ctx.moveTo(x-10*u, hy-13.5*u);
    ctx.quadraticCurveTo(x, hy-24*u, x+10*u, hy-13.5*u); ctx.closePath();
    ctx.fillStyle = C('purple'); ctx.fill();
  }
  ctx.restore();
}

function charLook(id){

  return CHARACTERS[id] && CHARACTERS[id].look;
}
function activeLook(){ return charLook(save.selected) || save.custom; }
function drawActiveDetective(x, y, s, o){
  const c = CHARACTERS[save.selected];
  if(c && c.critter) drawCritter(x, y, c.critter, s*1.05, o);
  else drawDetective(x, y, activeLook(), s, o);
}

/* ============================================================
   2.5D SCENE FRAMEWORK
   ============================================================ */
const HORIZON = 330;
let camX = 0, camDrift = 0;
let zoomMode = false, xrayOn = false, micOn = false;
let lens = { x:W/2, y:H/2 };
let renderingLens = false;
let micTimer = 0;

/* pseudo-3D box: front face + top face (skewed toward room center) */
function box3d(x, y, w, h, d, front, top, r){
  const k = ((x + w/2) - W/2) * -0.05;
  quadf(x, y, x+w, y, x+w+k, y-d, x+k, y-d, top);
  softShadow(true, 10);
  fillRR(x, y, w, h, r === undefined ? 8 : r, front);
  softShadow(false);
}
function floorPlanks(cx, c1, c2, tile){
  ctx.fillStyle = vGrad(0, HORIZON, H-HORIZON, c1, c2);
  ctx.fillRect(0, HORIZON, W, H-HORIZON);
  const y0 = HORIZON+10, rows = 7;
  const yAt = i => y0 + Math.pow(i/rows, 1.65)*(H-y0);
  const xAt = (wx, y) => { const sx = wx - cx; return W/2 + (sx - W/2)*(1 + (y-y0)/(H-y0)*0.8); };
  if(tile){
    ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = tile;
    for(let i=0;i<rows;i++) for(let k=-2;k<14;k++){
      if(((i+k)%2+2)%2) continue;
      const y1 = yAt(i), y2 = yAt(i+1);
      ctx.beginPath();
      ctx.moveTo(xAt(k*90,y1), y1); ctx.lineTo(xAt(k*90+90,y1), y1);
      ctx.lineTo(xAt(k*90+90,y2), y2); ctx.lineTo(xAt(k*90,y2), y2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(160,50,120,0.10)'; ctx.lineWidth = 2;
  for(let i=0;i<=rows;i++){ const y = yAt(i);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let k=-2;k<14;k++){
    ctx.beginPath(); ctx.moveTo(xAt(k*90,y0), y0); ctx.lineTo(xAt(k*90,H), H); ctx.stroke();
  }
}

    ell(x, y, 7.5*s, 7.5*s, C('blueDeep'));
    ell(x, y, 5*s, 5*s, '#fff');
    txt('🍲', x, y+0.5*s, 6.5*s);
  } else if(id === 'crumbs'){
    [[-8,-2],[-3,4],[2,-5],[6,2],[9,-3],[0,8]].forEach(c2=>ell(x+c2[0]*s, y+c2[1]*s, 2.2*s, 1.8*s, '#c99a4a'));
  } else if(id === 'pouchIcon'){
    ctx.beginPath(); ctx.moveTo(x-7*s, y-4*s);
    ctx.quadraticCurveTo(x-10*s, y+8*s, x, y+9*s);
    ctx.quadraticCurveTo(x+10*s, y+8*s, x+7*s, y-4*s); ctx.closePath();
    ctx.fillStyle = '#9a6b4a'; ctx.fill();
    fillRR(-7*s+x, y-6*s, 14*s, 3.5*s, 1.5*s, '#7a5230');
    txt('₨', x, y+3*s, 7*s, {bold:true, color:'#f0d9a8'});
  } else if(id === 'hairpinIcon'){
    ctx.strokeStyle = '#b9b9c4'; ctx.lineWidth = 2.2*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-8*s, y-5*s); ctx.quadraticCurveTo(x+10*s, y-8*s, x+8*s, y+2*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-8*s, y+1*s); ctx.quadraticCurveTo(x+6*s, y-1*s, x+7*s, y+6*s); ctx.stroke();
    ell(x-8*s, y-2*s, 3*s, 3*s, C('pink'));
  } else if(id === 'seedsIcon'){
    [[-7,-3,-0.5],[-1,2,0.3],[5,-4,0.9],[8,3,-0.2],[0,-8,0.1]].forEach(sd=>{
      ctx.save(); ctx.translate(x+sd[0]*s, y+sd[1]*s); ctx.rotate(sd[2]);
      ell(0, 0, 2*s, 3.2*s, '#5a4632');
      ctx.strokeStyle = '#f0d9a8'; ctx.lineWidth = 0.7*s;
      ctx.beginPath(); ctx.moveTo(0, -2.5*s); ctx.lineTo(0, 2.5*s); ctx.stroke();
      ctx.restore();
    });
  } else if(id === 'rosetteIcon'){
    for(let i=0;i<8;i++){ const a2 = i*Math.PI/4; ell(x+Math.cos(a2)*6*s, y+Math.sin(a2)*6*s, 3*s, 3*s, C('pink')); }
    ell(x, y, 4.5*s, 4.5*s, C('gold'));
    fillRR(x-4*s, y+6*s, 3*s, 8*s, 1.5*s, C('pinkDeep'));
    fillRR(x+1*s, y+6*s, 3*s, 8*s, 1.5*s, C('pinkDeep'));
  } else if(id === 'paw'){
    ell(x, y+3*s, 7*s, 6*s, C('gold'));
    for(let i=0;i<3;i++) ell(x-6*s+i*6*s, y-6*s, 2.6*s, 3*s, C('gold'));
  }
  ctx.restore();
}

/* ============================================================
   GENERIC SCENE TEMPLATES (DHA Lahore) — background art only;
   hiding-spot furniture is drawn by the generic cover system.
   ============================================================ */
function sceneBase(cx, o){
  /* wall */
  ctx.fillStyle = vGrad(0, 0, HORIZON, o.wall1, o.wall2); ctx.fillRect(0, 0, W, HORIZON);
  if(o.stripes){
    ctx.fillStyle = 'rgba(255,255,255,'+(o.stripeA || 0.35)+')';
    for(let k=0;k<26;k++){ const x = k*56 - (cx*0.85 % 56); ctx.fillRect(x, 0, 24, HORIZON-56); }
  }
  fillRR(-10, HORIZON-58, W+20, 62, 0, o.wainscot); 
  ctx.fillStyle = 'rgba(90,40,90,0.18)'; ctx.fillRect(-10, HORIZON-58, W+20, 4);
  floorPlanks(cx, o.floor1, o.floor2, o.tile);
  /* light pool */
  ctx.save(); ctx.globalAlpha = 0.2;
  quadf(o.lightX - cx*0.85, HORIZON, o.lightX+150 - cx*0.85, HORIZON, o.lightX+330 - cx, H-40, o.lightX-80 - cx, H-40, '#fff6d8');
  ctx.restore();
}
function sceneOutdoorBase(cx, o){
  ctx.fillStyle = vGrad(0, 0, HORIZON, o.sky1 || '#bfe4ff', o.sky2 || '#e6f4ff'); ctx.fillRect(0, 0, W, HORIZON);
  ell(90 - cx*0.3, 74, 28, 28, '#fff3c9');
  /* far houses (DHA rooftops) */
  for(let k=0;k<8;k++){
    const bx2 = k*160 - cx*0.6;
    fillRR(bx2, HORIZON-120, 110, 122, 6, k%2 ? '#efe0d0' : '#e8d5c0');
    ctx.beginPath(); ctx.moveTo(bx2-8, HORIZON-118); ctx.lineTo(bx2+55, HORIZON-150); ctx.lineTo(bx2+118, HORIZON-118);
    ctx.closePath(); ctx.fillStyle = '#c96a4a'; ctx.fill();
    fillRR(bx2+38, HORIZON-90, 32, 40, 4, '#b98a5f');
  }
  /* hedge line */
  for(let k=0;k<20;k++){ const hx = k*90 - cx*0.85; ell(hx, HORIZON-16, 55, 34, k%2 ? '#6ab475' : '#7cc487'); }
  /* grass */
  ctx.fillStyle = vGrad(0, HORIZON, H-HORIZON, o.grass1 || '#bfe6c8', o.grass2 || '#9cd2a9'); ctx.fillRect(0, HORIZON, W, H-HORIZON);
  ctx.strokeStyle = 'rgba(60,120,80,0.15)'; ctx.lineWidth = 2;
  for(let i=0;i<6;i++){ const t = Math.pow(i/5,1.6), y = HORIZON+14+t*(H-HORIZON-14);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  /* path */
  ctx.fillStyle = '#f0e2c8';
  quadf(300-cx, HORIZON, 420-cx, HORIZON, 620-cx, H, 180-cx, H, '#f0e2c8');
}
function sceneVignette(){
  const vg3 = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*0.78);
  vg3.addColorStop(0, 'rgba(60,30,80,0)'); vg3.addColorStop(1, 'rgba(60,30,80,0.14)');
  ctx.fillStyle = vg3; ctx.fillRect(0, 0, W, H);
}

   generic cover system — each hiding spot IS a piece of furniture. */
function curScene(){
  const c = curCase();
  return SCENES[(c && c.scene) || 'bakery'] || SCENES.bakery;
}

/* ---- generic cover furniture (lift / slide / open by style) ---- */
function drawCoverGeneric(sp, t, cx){
  const x = sp.wx - cx*(sp.layer||1), y = sp.y, w = sp.w, h = sp.h;
  const st = sp.cover || 'box';
  const midX = x + w/2;
  ctx.save();
  if(st === 'cushion'){
    ell(midX, y+h*0.85, w*0.62, h*0.3, 'rgba(90,42,82,0.12)');
    ctx.save(); ctx.translate(x, y+h*0.55); ctx.rotate(-t*0.9);
    softShadow(true, 6);
    fillRR(0, -h*0.45, w, h*0.8, h*0.32, sp.col || C('pink'));
    softShadow(false);
    fillRR(w*0.12, -h*0.32, w*0.76, h*0.24, h*0.12, 'rgba(255,255,255,0.35)');
    ell(w/2, -h*0.05, 3, 3, shade(sp.col || C('pink'), 0.7));
    ctx.restore();
  } else if(st === 'rug'){
    ell(midX, y+h*0.6, w*0.8, h*0.55, sp.col || C('purplePale'));
    ell(midX, y+h*0.6, w*0.55, h*0.36, shade(sp.col || C('purplePale'), 1.12));
    ctx.save(); ctx.translate(x+w*0.85, y+h*0.75); ctx.rotate(-t*1.1);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-w*0.7, -h*0.15); ctx.lineTo(-w*0.6, h*0.35);
    ctx.closePath(); ctx.fillStyle = shade(sp.col || C('purplePale'), 0.88); ctx.fill();
    ctx.restore();
  } else if(st === 'pot'){
    if(t>0.05){ /* leaves tilt aside */ }
    ctx.save(); ctx.translate(midX, y+h*0.35); ctx.rotate(-t*0.55); ctx.translate(-midX, -(y+h*0.35));
    ell(midX, y+h*0.2, w*0.42, h*0.28, sp.col || '#7cc487');
    ell(midX-w*0.26, y+h*0.05, w*0.24, h*0.18, shade(sp.col || '#7cc487', 1.1));
    ell(midX+w*0.25, y+h*0.07, w*0.24, h*0.17, shade(sp.col || '#7cc487', 0.85));
    ctx.restore();
    quadf(x+w*0.14, y+h*0.42, x+w*0.86, y+h*0.42, x+w*0.74, y+h, x+w*0.26, y+h, C('pinkDeep'));
    fillRR(x+w*0.08, y+h*0.36, w*0.84, h*0.16, 5, C('pink'));
  } else if(st === 'jar'){
    softShadow(true, 5);
    fillRR(x+w*0.12, y+h*0.22, w*0.76, h*0.78, w*0.2, 'rgba(255,255,255,0.88)');
    softShadow(false);
    fillRR(x+w*0.22, y+h*0.48, w*0.56, h*0.34, 4, sp.col || '#f3e8d0');
    ctx.save(); ctx.translate(midX, y+h*0.22); ctx.rotate(-t*1.1); ctx.translate(t*-10, t*-6);
    fillRR(-w*0.44, -h*0.16, w*0.88, h*0.18, 6, sp.col2 || C('purple'));
    ctx.restore();
  } else if(st === 'box' || st === 'chest'){
    softShadow(true, 6);
    fillRR(x, y+h*0.3, w, h*0.7, 6, sp.col || '#e8b04a');
    softShadow(false);
    ctx.strokeStyle = shade(sp.col || '#e8b04a', 0.75); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x+4, y+h*0.65); ctx.lineTo(x+w-4, y+h*0.65); ctx.stroke();
    if(st === 'chest'){ ell(midX, y+h*0.66, 4, 5, C('gold')); }
    ctx.save(); ctx.translate(x, y+h*0.3); ctx.rotate(-t*1.0);
    fillRR(0, -h*0.16, w, h*0.2, 5, shade(sp.col || '#e8b04a', 1.15));
    ctx.restore();
  } else if(st === 'drawer'){
    softShadow(true, 6);
    fillRR(x-w*0.08, y-h*0.5, w*1.16, h*1.6, 8, sp.col || '#c99be0');
    softShadow(false);
    fillRR(x+w*0.04, y-h*0.38, w*0.92, h*0.4, 5, shade(sp.col || '#c99be0', 1.12));
    ell(midX, y-h*0.18, 3.5, 3.5, C('gold'));
    const slide = t*h*0.7;
    fillRR(x+w*0.04, y+h*0.08, w*0.92, h*0.62 + slide*0.2, 5, shade(sp.col || '#c99be0', t>0.05 ? 0.8 : 1.12));
    if(t>0.05){ fillRR(x+w*0.1, y+h*0.14+slide*0.35, w*0.8, h*0.24, 4, 'rgba(60,35,80,0.45)'); }
    ell(midX, y+h*0.36+slide*0.3, 3.5, 3.5, C('gold'));
  } else if(st === 'book'){
    const slide = t*w*0.75;
    softShadow(true, 4);
    fillRR(x+slide, y, w*0.5, h, 4, sp.col || C('blueDeep'));
    softShadow(false);
    fillRR(x+slide+w*0.06, y+h*0.12, w*0.06, h*0.76, 2, '#fff');
    fillRR(x+w*0.52+slide*0.2, y+h*0.06, w*0.42, h*0.94, 4, sp.col2 || C('pinkDeep'));
  } else if(st === 'curtain'){
    fillRR(x-6, y-h*0.14, w+12, h*0.14, 5, sp.col2 || C('purpleDeep'));
    const gather2 = 1 - t*0.72;
    ctx.fillStyle = sp.col || 'rgba(255,143,199,0.85)';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + w*0.3*gather2, y+h*0.5, x, y+h);
    ctx.lineTo(x + w*gather2, y+h);
    ctx.quadraticCurveTo(x + w*0.7*gather2, y+h*0.5, x + w*gather2, y);
    ctx.closePath(); ctx.fill();
  } else if(st === 'basket'){
    softShadow(true, 5);
    quadf(x+w*0.08, y+h*0.3, x+w*0.92, y+h*0.3, x+w*0.82, y+h, x+w*0.18, y+h, sp.col || '#c99a66');
    softShadow(false);
    ctx.strokeStyle = shade(sp.col || '#c99a66', 0.78); ctx.lineWidth = 2;
    for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(x+w*0.12, y+h*(0.45+k*0.16)); ctx.lineTo(x+w*0.88, y+h*(0.45+k*0.16)); ctx.stroke(); }
    ctx.save(); ctx.translate(x+w*0.08, y+h*0.3); ctx.rotate(-t*0.95);
    ell(w*0.42, -h*0.05, w*0.46, h*0.16, shade(sp.col || '#c99a66', 1.15));
    ctx.restore();
  } else if(st === 'bush'){
    ctx.save(); ctx.translate(midX, y+h); ctx.rotate(t*0.35); ctx.translate(-midX, -(y+h));
    ell(midX, y+h*0.5, w*0.5, h*0.5, sp.col || '#6ab475');
    ell(midX-w*0.3, y+h*0.62, w*0.3, h*0.34, shade(sp.col || '#6ab475', 1.1));
    ell(midX+w*0.3, y+h*0.6, w*0.3, h*0.34, shade(sp.col || '#6ab475', 0.85));
    ell(midX-w*0.12, y+h*0.34, 3, 3, C('pink'));
    ell(midX+w*0.18, y+h*0.48, 3, 3, C('gold'));
    ctx.restore();
  } else if(st === 'mat'){
    ctx.save(); ctx.translate(x, y+h*0.6); ctx.rotate(-t*0.6);
    fillRR(0, -h*0.4, w, h*0.75, 7, sp.col || '#e8b04a');
    ctx.strokeStyle = shade(sp.col || '#e8b04a', 0.8); ctx.lineWidth = 2;
    rr(w*0.08, -h*0.28, w*0.84, h*0.5, 5); ctx.stroke();
    ctx.restore();
  } else if(st === 'bag'){
    softShadow(true, 5);
    ctx.beginPath();
    ctx.moveTo(x+w*0.1, y+h);
    ctx.quadraticCurveTo(x-w*0.05, y+h*0.3, x+w*0.22, y+h*(0.18 + t*0.1));
    ctx.quadraticCurveTo(midX, y+h*(t>0.4 ? 0.16 : 0.06), x+w*0.78, y+h*(0.18 + t*0.1));
    ctx.quadraticCurveTo(x+w*1.05, y+h*0.3, x+w*0.9, y+h);
    ctx.closePath(); ctx.fillStyle = sp.col || '#fdf6e8'; ctx.fill();
    softShadow(false);
    fillRR(x+w*0.18, y+h*0.5, w*0.64, h*0.26, 5, shade(sp.col || '#fdf6e8', 0.9));
    if(sp.tag) txt(sp.tag, midX, y+h*0.64, Math.min(11, w*0.2), {bold:true, color:'#b09a6a'});
  } else if(st === 'stone'){
    ctx.save(); ctx.translate(midX, y+h*0.8); ctx.rotate(-t*0.8); ctx.translate(-midX, -(y+h*0.8));
    ell(midX, y+h*0.5, w*0.5, h*0.42, sp.col || '#b9b9c4');
    ell(midX-w*0.15, y+h*0.36, w*0.2, h*0.14, 'rgba(255,255,255,0.4)');
    ctx.restore();
  } else if(st === 'painting'){
    ctx.save(); ctx.translate(midX, y); ctx.rotate(t*0.35); ctx.translate(-midX, -y);
    softShadow(true, 6);
    fillRR(x, y, w, h, 5, '#fffdfe');
    softShadow(false);
    fillRR(x+w*0.09, y+h*0.11, w*0.82, h*0.78, 3, sp.col || C('bluePale'));
    ell(midX, y+h*0.5, w*0.24, h*0.2, sp.col2 || C('pink'));
    ctx.restore();
  } else if(st === 'plank'){
    softShadow(true, 5);
    fillRR(x, y+h*0.25, w, h*0.36, 6, sp.col || '#c99a66');
    softShadow(false);
    fillRR(x+w*0.06, y+h*0.6, w*0.1, h*0.4, 3, shade(sp.col || '#c99a66', 0.8));
    fillRR(x+w*0.84, y+h*0.6, w*0.1, h*0.4, 3, shade(sp.col || '#c99a66', 0.8));
    if(t>0.05){ ctx.save(); ctx.translate(x, y+h*0.25); ctx.rotate(-t*0.5);
      fillRR(0, 0, w, h*0.36, 6, shade(sp.col || '#c99a66', 1.1)); ctx.restore(); }
  }
  ctx.restore();
}
function drawGenericSpots(cx){
  const c = curCase(); if(!c || !cp) return;
  const spots = [...spotList()].sort((a,b)=>a.y - b.y);
  for(const sp of spots){
    const t = spotOpenT(sp.id);
    const sx = sp.wx - cx*(sp.layer||1);
    if(sx + sp.w < -60 || sx > W+60) continue;
    if(sp.type === 'plain'){
      if(sp.decor) drawCoverGeneric(sp, 0, cx);
      drawSpotContents(sp.id, sx + sp.w/2, sp.y + sp.h/2, 0.9);
    } else {
      if(t > 0.4) drawSpotContents(sp.id, sx + sp.w/2, sp.y + sp.h*0.62, 1);
      drawCoverGeneric(sp, t, cx);
    }
  }
}
function spotById(id){ return spotList().find(s=>s.id===id); }
function spotScreenX(s, cx){ return s.wx - cx * s.layer; }
function spotOpenT(id){ return spotAnim[id] || 0; }

function drawBakery(cx){
  const bx = wx => wx - cx*0.85;     // back layer x
  const mx = wx => wx - cx;          // mid layer x

  ctx.fillStyle = vGrad(0, 0, HORIZON, '#ffd9ee', '#ffb3dd');
  ctx.fillRect(0, 0, W, HORIZON);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let k=0;k<26;k++){
    const x = k*56 - (cx*0.85 % 56);
    ctx.fillRect(x, 0, 24, HORIZON-56);
  }
  fillRR(-10, HORIZON-58, W+20, 62, 0, '#f79cd0');            // wainscot
  ctx.fillStyle = 'rgba(226,105,158,0.35)';
  ctx.fillRect(-10, HORIZON-58, W+20, 5);
  /* string lights */
  ctx.strokeStyle = 'rgba(124,92,191,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10, 30);
  for(let k=0;k<10;k++){ ctx.quadraticCurveTo(bx(k*110+55), 52, bx(k*110+110), 28); }
  ctx.stroke();

  /* the openable shelf box (top shelf right) */
  { const s = spotById('shelfBox'), t = spotOpenT('shelfBox');

  }
  /* the flour jar (lower shelf) */
  { const s = spotById('flourJar'), t = spotOpenT('flourJar');
    const x = bx(s.wx), y = 122;
    if(t > 0.5) drawSpotContents('flourJar', x + s.w/2, y + 26, 1);
    softShadow(true, 6);
    ctx.globalAlpha = t > 0.5 ? 0.82 : 1;
    fillRR(x, y, s.w, 60, 12, '#fdfaf2');
    ctx.globalAlpha = 1;
    softShadow(false);
    fillRR(x+8, y+22, s.w-16, 26, 4, '#f3e8d0');
    txt('FLOUR', x + s.w/2, y+36, 11, {bold:true, color:'#a8946a'});

    ctx.rotate(-t*1.1); ctx.translate(t*-14, t*-8);
    fillRR(-s.w/2-3, -12, s.w+6, 14, 6, '#b98ae0'); ctx.restore();
  }
  /* menu board */
  { const s = spotById('menuBoard');
    const x = bx(s.wx);
    softShadow(true, 8);
    fillRR(x, s.y, s.w, s.h, 12, '#5d4a78');

/* ============================================================
   CASE PROGRESS (mid-case autosave)
   ============================================================ */
let cp = null;      // current case progress
function cpSave(){ save.caseProg = cp; persist(); }
function beginCase(n, replay){
  const c = caseByLevel(n); if(!c) return;
  if(save.caseProg && save.caseProg.level === n && !replay){
    cp = save.caseProg;
    /* upgrade older mid-case saves */
    cp.leads = cp.leads || {}; cp.locs = cp.locs || {}; cp.people = cp.people || {};
    cp.ev = cp.ev || {}; cp.pins = cp.pins || {}; cp.metNpc = cp.metNpc || {};
  } else {
    cp = { level:n, found:{}, opened:{}, inspected:{}, notes:[], pressed:{}, broken:{},
           curSt:{}, cracked:{}, cleared:{}, hintsUsed:0, wrongAccuse:0, wrongPresent:0,
           talked:{}, arrived:false, fpUsed:false,
           leads:{}, locs:{}, people:{}, ev:{}, pins:{}, metNpc:{}, gathered:false };
    cpSave();
  }
  popup = null; journalOpen = false; cluePicker = null; evPicker = null; talkSel = null;
  state = 'city';
}
function enterScene(){
  const c = curCase(); if(!c) return;
  spotAnim = {};
  for(const id in cp.opened) spotAnim[id] = 1;
  camX = 0; zoomMode = false; xrayOn = false; micOn = false;
  lastFind = time; nextHint = hintDelay();
  state = 'scene';
  if(!cp.arrived){
    startDlg(c.arrive.map(fmtLine), ()=>{ cp.arrived = true; cpSave(); });
  }
}
/* ---- v2 investigation helpers ---- */
function locById(id){ const c = curCase(); return c && c.locations.find(l=>l.id===id); }
function evInfo(id){
  const c = curCase(); if(!c) return null;
  const cl = c.clues.find(x=>x.id===id);
  if(cl) return {id, name:cl.name, icon:cl.icon || cl.id, desc:cl.desc};
  const e = c.evidence[id];
  return e ? {id, name:e.name, icon:e.icon, desc:e.desc} : null;
}
function addEvidence(id){
  if(cp.ev[id]) return false;
  cp.ev[id] = 1; cpSave(); return true;
}
function addPerson(pid){
  if(cp.people[pid]) return false;
  cp.people[pid] = 1;
  const c = curCase();
  const s = c.suspects.find(x=>x.id===pid);
  if(s){
    cp.notes.push('📌 Person of interest: ' + s.name + ' (' + s.role + ')');
    if(s.home && !cp.locs[s.home]){
      cp.locs[s.home] = 1;
      const L = locById(s.home);
      if(L) cp.notes.push('🗺 ' + L.name + ' is now on the map.');
    }
  }
  cpSave(); return true;
}
function unlockLocsFor(clueId){
  const c = curCase();
  const lead = c.leads && c.leads[clueId];
  if(!lead) return;
  cp.leads[clueId] = 1;
  for(const lid of lead.unlocks){
    if(!cp.locs[lid]){ cp.locs[lid] = 1; const L = locById(lid); if(L) cp.notes.push('🗺 New place to visit: ' + L.name + '!'); }
  }
  cpSave();
}
function knownPeople(){
  const c = curCase(); if(!c) return [];
  return c.suspects.filter(s=>cp.people[s.id]);
}
function pinsOf(pid){ return cp.pins[pid] || {}; }
function fullyPinned(pid){
  const pn = pinsOf(pid);
  return pn.motive && pn.means && pn.opp;
}
function boardSuspect(){
  return knownPeople().find(s=>fullyPinned(s.id)) || null;
}
function gatherReady(){
  const c = curCase();
  return c && fullyPinned(c.culprit) && cp.cracked[c.culprit];
}
function locHasNews(L){
  /* does this location still have something to do? */
  const c = curCase();
  for(const n of L.npcs){ if(!cp.metNpc[n.id]) return true; }
  const sus = c.suspects.find(s=>cp.people[s.id] && s.home === L.id);
  if(sus && !cp.cracked[sus.id] && !cp.cleared[sus.id] && fullyPinned(sus.id)) return true;
  if(sus && !cp.talked[sus.id]) return true;
  return false;
}
function nextThread(){
  const c = curCase(); if(!c) return '';
  if(!allCluesFound()) return 'Search ' + c.place + ' — ' + (c.clues.length - cluesFound()) + ' clue' + (c.clues.length-cluesFound()>1?'s':'') + ' still hidden!';
  const openLoc = c.locations.find(L=>cp.locs[L.id] && locHasNews(L));
  if(openLoc) return 'Visit ' + openLoc.name + ' on the city map!';
  const unpinned = knownPeople().filter(s=>!cp.cleared[s.id] && !fullyPinned(s.id));
  if(unpinned.length) return 'Pin Motive, Means & Opportunity on the Mystery Board!';
  if(!culpritCracked()){ const sus = boardSuspect(); if(sus) return 'Question ' + sus.name + ' at ' + (locById(sus.home)||{}).name + ' — break their story!'; }
  if(gatherReady()) return 'Gather everyone from the Mystery Board! ⚖';
  return 'Follow your nose, detective!';
}
function curCase(){ return cp ? caseByLevel(cp.level) : null; }
function clueDone(id){ return cp && cp.found[id]; }
function cluesFound(){ const c = curCase(); return c ? c.clues.filter(cl=>cp.found[cl.id]).length : 0; }
function allCluesFound(){ const c = curCase(); return c && cluesFound() === c.clues.length; }
function culpritCracked(){ const c = curCase(); return c && cp.cracked[c.culprit]; }
function clueAt(spotId){
  const c = curCase(); if(!c) return null;
  return c.clues.find(cl=>cl.spot === spotId && !cp.found[cl.id]) || null;
}
function herringAt(spotId){
  const c = curCase(); if(!c) return null;
  return c.herrings.find(h=>h.spot === spotId) || null;
}
function cluePresentAt(spotId){ return !!clueAt(spotId); }
function drawSpotContents(spotId, x, y, s){
  const cl = clueAt(spotId);
  if(cl){
    if(cl.gear === 'magnifier' && !renderingLens) return;
    drawClueIcon(cl.icon || cl.id, x, y, s);
    const tw = 0.6 + Math.sin(time*4)*0.4;
    sparkle4(x + 12*s, y - 12*s, 5*s*tw, '#fff', 0.9);
    sparkle4(x - 10*s, y + 8*s, 3.5*s*tw, C('gold'), 0.8);
    return;
  }
  const c2 = curCase();
  if(c2 && c2.bonus && c2.bonus.spot === spotId && !cp.bonusTaken){
    drawClueIcon('paw', x, y, s);
    sparkle4(x+10*s, y-10*s, 5*s, C('gold'), 0.7+Math.sin(time*4)*0.3);
    return;
  }
  const h = herringAt(spotId);
  if(h && !cp.inspected[h.id]) drawClueIcon('note', x, y, s*0.9);
}
function glintAt(x, y, key){
  if(!cp || cp.level !== 1 || clueDone('bootprint')) return;
  const ph = (time*0.9) % 3;
  if(ph < 0.8) sparkle4(x + Math.sin(time*3)*6, y - 8, 7*(0.5+ph), '#fff', 0.9 - ph);
}

let dlg = null;
const TYPE_SPEED = 42;
function fmtLine(ln){ return ln; }
function speakerInfo(sp){
  const c = curCase() || caseByLevel(save.levelReached) || CASES[0];
  if(sp === 'npc' && dlg && dlg.npc) return { name:dlg.npc.name, look:dlg.npc.look, grown:dlg.npc.grown };
  if(sp === 'me'){
    const sel = CHARACTERS[save.selected];
    return { name: (sel && !sel.critter) ? sel.name() : (PLAYER_TAG || 'Detective'),
             look: sel && sel.critter ? null : activeLook(), critter: sel && sel.critter, me:true };
  }
  if(c){
    if(c.client.id === sp) return { name:c.client.name, look:c.client.look, grown:c.client.grown };
    const s = c.suspects.find(s=>s.id === sp);
    if(s) return { name:s.name, look:s.look, grown:s.grown };
  }
  return { name:'???', look:null };
}
function startDlg(lines, onDone, npc){ dlg = { lines, i:0, t0:time, onDone, npc }; }
function dlgAdvance(){
  if(!dlg) return;
  const ln = dlg.lines[dlg.i];
  const shown = dlg.t0 < 0 ? 1e9 : Math.floor((time - dlg.t0) * TYPE_SPEED);
  if(shown < ln.text.length){ dlg.t0 = -1; SFX.tap(); return; }
  dlg.i++;
  if(dlg.i >= dlg.lines.length){
    const cb = dlg.onDone; dlg = null;
    if(cb) cb();
  } else { dlg.t0 = time; SFX.tap(); }
}

  const shown = dlg.t0 < 0 ? ln.text.length : Math.min(ln.text.length, Math.floor((time - dlg.t0) * TYPE_SPEED));
  const partial = ln.text.slice(0, shown);
  const lines = wrapLines(partial, 17, bw-130);
  lines.slice(0,5).forEach((l, i)=> txt(l, bx+104, by+34+i*24, 17, {align:'left'}));

function npcMeet(L, n){
  const needs = n.needsClue && !cp.found[n.needsClue];

    startDlg([{sp:'npc', mood:'smile', text:'Hello, detective! Come back if you find something I can help with.'}], null, n);
    return;
  }
  startDlg(n.talk.map(fmtLine), ()=>{
    if(cp.metNpc[n.id]) return;
    cp.metNpc[n.id] = 1;
    let delay = 0;
    (n.gives || []).forEach(evId=>{
      if(addEvidence(evId)){ cp.notes.push('🧾 Evidence: ' + evInfo(evId).name); }
    });
    (n.names || []).forEach(pid=>{ addPerson(pid); });
    if(n.clears){
      cp.cleared[n.clears] = 1;
      const sc = curCase().suspects.find(x=>x.id===n.clears);
      if(sc) { cp.notes.push('✔ CLEARED: ' + sc.name + ' couldn’t have done it.'); floaty('✔ ' + sc.name + ' is CLEARED!', W/2, 200, '#3f9e6a', 20); SFX.chime(); }

  }, n);

   ============================================================ */
let gatherT = 0;
function startGather(){
  cp.gathered = true;
  cp.gatherTalked = false;    /* replay the summons if the gathering is re-entered */
  cpSave();
  gatherT = 0;
  accusePick = null;
  state = 'gather';
}
function drawGather(){
  setMusic('tense');
  gatherT += lastDt;
  drawSceneWorld(0);
  ctx.fillStyle = 'rgba(45,25,70,0.35)'; ctx.fillRect(0, 0, W, H);
  txt('THE GATHERING', W/2, 60, 26, {bold:true, color:'#fff', outline:'rgba(45,25,70,0.6)'});
  const c = curCase();
  const folks = [{look:c.client.look, grown:c.client.grown}, ...knownPeople().map(s2=>({look:s2.look, grown:s2.grown, id:s2.id}))];
  folks.forEach((f, i)=>{
    const t = Math.min(1, Math.max(0, (gatherT - i*0.45) / 0.9));
    if(t <= 0) return;
    const e = 1 - Math.pow(1-t, 2.2);
    const tx2 = W + 60 - (W + 60 - (88 + i*104)) * e;
    const mood = f.id === c.culprit ? 'nervous' : 'smile';
    drawDetective(tx2, 596, f.look, f.grown ? 0.8 : 0.88, {grown:f.grown, walk:t<1, mood, ph:i});
  });
  drawActiveDetective(W/2, 730, 1.0, {pose:'point', ph:9});
  if(gatherT > folks.length*0.45 + 1.1 && !dlg && !cp.gatherTalked){
    cp.gatherTalked = true; cpSave();
    startDlg(c.gather.map(fmtLine), ()=>{
      cp.accuseIntroDone = true; cpSave();
      state = 'accuse'; accusePick = null;
    });
  }
  if(cp.gatherTalked && !dlg && state === 'gather'){ state = 'accuse'; accusePick = null; }
  drawDlg();
}

function hintDelay(){

function spotScreenPos(s){
  return { x: s.wx - camX*s.layer + s.w/2, y: s.y + s.h/2 };
}
function unfoundClueSpots(){
  const c = curCase(); if(!c) return [];

function drawLens(){
  const r = 78;
  ctx.save();
  ctx.beginPath(); ctx.arc(lens.x, lens.y, r, 0, Math.PI*2); ctx.clip();
  ctx.translate(lens.x, lens.y); ctx.scale(2.1, 2.1); ctx.translate(-lens.x, -lens.y);
  renderingLens = true; drawSceneWorld(camX); renderingLens = false;
  ctx.restore();
  ctx.strokeStyle = C('purpleDeep'); ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(lens.x, lens.y, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = C('pink'); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(lens.x, lens.y, r+6, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = C('purpleDeep'); ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lens.x + r*0.72, lens.y + r*0.72); ctx.lineTo(lens.x + r*1.35, lens.y + r*1.35); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(lens.x - r*0.35, lens.y - r*0.35, r*0.42, Math.PI*0.9, Math.PI*1.45); ctx.stroke();
}
function drawXray(){
  ctx.fillStyle = 'rgba(40,80,160,0.32)';
  ctx.fillRect(0,0,W,H);
  const c = curCase();
  for(const cl of c.clues){
    if(cp.found[cl.id]) continue;
    const s = spotById(cl.spot);
    if(s.type === 'plain') continue;
    const p = spotScreenPos(s);
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(time*4)*0.25;
    ctx.filter = 'blur(1px)';
    drawClueIcon(cl.id, p.x, p.y, 0.9);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(200,240,255,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 26 + Math.sin(time*4)*4, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  txt('X-RAY MODE', W/2, 66, 16, {bold:true, color:'#bfe4ff', alpha:0.8});
}
function updateDrawMic(dt){
  micTimer += dt;
  if(micTimer > 4){
    micTimer = 0;
    const spots = unfoundClueSpots();
    if(spots.length){
      let best = null, bd = 1e9;
      for(const s of spots){
        const p = spotScreenPos(s);
        const d = Math.abs(p.x - W/2);
        if(d < bd){ bd = d; best = p; }
      }
      micPing = { x:best.x, y:best.y, t:0 };
      SFX.ping();
    }
  }
  if(micPing){
    micPing.t += dt;
    const r = micPing.t * 120;
    for(let k=0;k<3;k++){
      const rr2 = r - k*24; if(rr2 <= 0) continue;
      ctx.strokeStyle = 'rgba(255,143,199,' + Math.max(0, 0.8 - rr2/160) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(micPing.x, micPing.y, rr2, 0, Math.PI*2); ctx.stroke();
    }
    if(micPing.t > 1.6) micPing = null;
  }
}
function hintUpdate(){
  if(allCluesFound()) return;
  if(time - lastFind > nextHint){
    lastFind = time; nextHint = 30;
    const spots = unfoundClueSpots();
    if(spots.length){
      const s = spots[Math.floor(Math.random()*spots.length)];
      const p = spotScreenPos(s);
      hintPulse = { x: p.x + (Math.random()-0.5)*70, y: p.y + (Math.random()-0.5)*50, t:0 };
      cp.hintsUsed++; cpSave();
    }
  }
  if(hintPulse){
    hintPulse.t += lastDt;
    const a = Math.max(0, 1.4 - hintPulse.t);
    sparkle4(hintPulse.x, hintPulse.y - hintPulse.t*16, 9*a, C('gold'), a);
    sparkle4(hintPulse.x - 14, hintPulse.y + 6 - hintPulse.t*12, 6*a, '#fff', a);
    sparkle4(hintPulse.x + 12, hintPulse.y - 4 - hintPulse.t*20, 5*a, C('pink'), a);
    if(hintPulse.t > 1.6) hintPulse = null;
  }
}

function sceneTap(p){
  if(popup || journalOpen) return;

  const spots = [...spotList()].sort((a,b)=>a.w*a.h - b.w*b.h);

function tapSpot(s, p){
  const cl = clueAt(s.id), h = herringAt(s.id);
  if(s.type !== 'plain' && !cp.opened[s.id]){
    cp.opened[s.id] = 1; cpSave(); SFX.pop();
    if(!cl && !(h && !cp.inspected[h.id])){
      SFX.dust();
      sparkBurst(p.x, p.y, '#e0d4c2', 9);
      floaty(randEmpty(), Math.min(W-90, Math.max(90, p.x)), Math.max(70, p.y-34), C('inkSoft'), 14);
    }
    return;
  }
  if(cl){
    if(cl.gear === 'magnifier' && !renderingLens && !zoomMode){
      if(!save.gear.magnifier) floaty('Something teeny-tiny… you need the 🔍 Magnifying Glass from the Shop!', p.x, Math.max(80,p.y-24), C('purpleDeep'), 13);
      else floaty('Something teeny-tiny… switch on your 🔍 lens!', p.x, Math.max(80,p.y-24), C('purpleDeep'), 14);
      SFX.hmm(); return;
    }
    collectClue(cl, p); return;
  }
  if(c.bonus && s.id === c.bonus.spot && !cp.bonusTaken){
    cp.bonusTaken = 1; save.pawprints = (save.pawprints||0) + 1; cpSave(); persist();
    SFX.coin(); sparkBurst(p.x, p.y, C('gold'), 22);
    floaty('🐾 Golden pawprint! (' + save.pawprints + '/3)', W/2, Math.max(80, p.y-30), C('goldDeep'), 18);
    if(save.pawprints >= 3 && !save.unlocked.whiskers){
      save.unlocked.whiskers = true; persist(); SFX.fanfare(); burstConfetti(W/2, 300, 60);
      floaty('😺 Detective Whiskers joins your squad!', W/2, 200, C('pinkDeep'), 18);
    }
    return;
  }
  if(h){
    if(!cp.inspected[h.id]){
      cp.inspected[h.id] = 1; cpSave(); SFX.hmm();
      popup = { type:'herring', h };
    } else {
      SFX.dust();
      floaty('Already checked that.', p.x, Math.max(70,p.y-30), C('inkSoft'), 13);
    }
    return;
  }
  SFX.dust();
  sparkBurst(p.x, p.y, '#e0d4c2', 7);
  floaty(randEmpty(), Math.min(W-90, Math.max(90, p.x)), Math.max(70, p.y-34), C('inkSoft'), 14);
}

function visibleStatements(s){
  const out = [];
  for(const t of s.testimony){
    if(t.hidden && !isRevealed(s, t)) continue;
    if(t.becomes && cp.broken[t.id]) continue;    // replaced by follow-up
    out.push(t);
  }
  return out;
}
function isRevealed(s, t){
  return s.testimony.some(o=>o.becomes === t.id && cp.broken[o.id]);
}

function presentClue(s, st, clId){
  const c = curCase();
  const cl = c.clues.find(x=>x.id === clId);
  if(st.lieBrokenBy === clId && !cp.broken[st.id] && !(st.final && cp.cracked[s.id])){

    cp.wrongPresent = 0;
    shake = 0.5; SFX.sting();
    cp.notes.push('💥 ' + s.name + '’s story cracked by: ' + cl.name);
    if(st.final){ cp.cracked[s.id] = 1; }
    cpSave();
    const lines = [{sp:s.id, mood: st.final ? 'cracked' : 'shock', text: st.brokenLine}];
    if(st.final){
      lines.push({sp:'me', mood:'smile', text:'Your whole story has fallen apart, ' + s.name + '. Time to end this mystery!'});
    } else if(st.becomes){
      lines.push({sp:'me', mood:'ooh', text:'Oho! So your story CHANGES! Let’s hear the new one…'});
    }
    startDlg(lines, ()=>{
      if(st.becomes){ cp.curSt[s.id] = 0; cpSave(); }

    });
  } else {
    cp.wrongPresent++;
    cpSave();
    SFX.hmm();
    const brush = [
      'What does ' + (cl ? 'that' : 'this') + ' have to do with anything, detective?',
      'Hmph. That proves absolutely nothing.',
      'Is this a joke? I am unmoved.'
    ][Math.min(2, (cp.wrongPresent-1) % 3)];
