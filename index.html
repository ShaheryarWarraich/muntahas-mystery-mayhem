/* ============================================================
   VALIDATION + DEBUG
   ============================================================ */
function validateCases(){
  const errs = [];
  for(const c of CASES){
    if(!SCENES[c.scene]){ errs.push('case '+c.n+': unknown scene '+c.scene); continue; }
    const scSpots = SCENES[c.scene].spots;
    for(let i=0;i<scSpots.length;i++) for(let j=i+1;j<scSpots.length;j++){
      const a = scSpots[i], b = scSpots[j];
      if((a.layer||1) !== (b.layer||1)) continue;
      if(!(a.wx+a.w+8 < b.wx-8 || b.wx+b.w+8 < a.wx-8 || a.y+a.h+8 < b.y-8 || b.y+b.h+8 < a.y-8))
        errs.push(c.scene+': spot tap-zones overlap: '+a.id+' / '+b.id);
    }
    const spotIds = scSpots.map(s=>s.id);
    if(c.bonus && !spotIds.includes(c.bonus.spot)) errs.push('case '+c.n+': bonus spot missing '+c.bonus.spot);
    const used = {};
    for(const cl of c.clues){
      if(!spotIds.includes(cl.spot)) errs.push('case '+c.n+': clue '+cl.id+' spot missing: '+cl.spot);
      if(used[cl.spot]) errs.push('case '+c.n+': spot double-used: '+cl.spot);
      used[cl.spot] = 1;
    }
    for(const h of c.herrings){
      if(!spotIds.includes(h.spot)) errs.push('case '+c.n+': herring '+h.id+' spot missing: '+h.spot);
      if(used[h.spot]) errs.push('case '+c.n+': spot double-used: '+h.spot);
      used[h.spot] = 1;
    }
    if(!c.suspects.find(s=>s.id === c.culprit)) errs.push('case '+c.n+': culprit missing: '+c.culprit);
    if(!c.clues.find(cl=>cl.id === c.provingClue)) errs.push('case '+c.n+': provingClue missing: '+c.provingClue);
    const clueIds = c.clues.map(cl=>cl.id);
    for(const s of c.suspects){
      for(const t of s.testimony){
        if(t.lieBrokenBy && !clueIds.includes(t.lieBrokenBy)) errs.push('case '+c.n+': '+s.id+'/'+t.id+' lieBrokenBy unknown clue: '+t.lieBrokenBy);
        if(t.becomes && !s.testimony.find(o=>o.id === t.becomes)) errs.push('case '+c.n+': '+s.id+'/'+t.id+' becomes unknown: '+t.becomes);
      }
    }
    const culp = c.suspects.find(s=>s.id === c.culprit);
    if(culp && !culp.testimony.some(t=>t.final)) errs.push('case '+c.n+': culprit has no final lie');
    /* ---- v2: leads / locations / evidence / truth graph ---- */
    const locIds = c.locations.map(L=>L.id);
    for(const clId in (c.leads||{})){
      if(!clueIds.includes(clId)) errs.push('case '+c.n+': lead for unknown clue '+clId);
      for(const lid of c.leads[clId].unlocks)
        if(!locIds.includes(lid)) errs.push('case '+c.n+': lead '+clId+' unlocks unknown loc '+lid);
    }
    const evIds = [...clueIds, ...Object.keys(c.evidence||{})];
    const givenEv = {}, namedPeople = {}, clearedPeople = {};
    for(const L of c.locations){
      for(const n of L.npcs){
        for(const e of (n.gives||[])){
          if(!evIds.includes(e)) errs.push('case '+c.n+': npc '+n.id+' gives unknown evidence '+e);
          givenEv[e] = 1;
        }
        for(const pid of (n.names||[])){
          if(!c.suspects.find(x=>x.id===pid)) errs.push('case '+c.n+': npc '+n.id+' names unknown person '+pid);
          namedPeople[pid] = 1;
        }
        if(n.clears){ clearedPeople[n.clears] = 1; namedPeople[n.clears] = namedPeople[n.clears] || 1; }
        if(n.needsClue && !clueIds.includes(n.needsClue)) errs.push('case '+c.n+': npc '+n.id+' needsClue unknown '+n.needsClue);
      }
    }
    /* every suspect must be discoverable and either clearable or pinnable */
    for(const su of c.suspects){
      if(!namedPeople[su.id] && !c.locations.some(L=>L.npcs.some(n=>(n.names||[]).includes(su.id))))
        errs.push('case '+c.n+': person '+su.id+' is never named by any witness');
      if(su.home && !locIds.includes(su.home)) errs.push('case '+c.n+': person '+su.id+' home unknown loc '+su.home);
      if(su.id === c.culprit){
        const tr = (c.truth||{})[su.id] || {};
        for(const slot of ['motive','means','opp']){
          if(!tr[slot]) errs.push('case '+c.n+': culprit missing truth.'+slot);
          else if(!clueIds.includes(tr[slot]) && !givenEv[tr[slot]])
            errs.push('case '+c.n+': culprit '+slot+' evidence '+tr[slot]+' is never obtainable');
        }
      } else if(!clearedPeople[su.id]){
        errs.push('case '+c.n+': innocent '+su.id+' can never be cleared');
      }
    }
    if(!(c.gather||[]).length) errs.push('case '+c.n+': no gather lines');
  }
  return errs;
}

  goCase(n){ beginCase(n, true); dlg = null; cp.arrived = true; enterScene(); dlg = null; },
  findAll(){ const c = curCase(); if(!c) return; c.clues.forEach(cl=>{ cp.found[cl.id] = true; }); cpSave(); },
  crack(){ const c = curCase(); if(!c) return; const s = c.suspects.find(x=>x.id===c.culprit);
           s.testimony.forEach(t=>{ if(t.lieBrokenBy) cp.broken[t.id] = 1; if(t.final) cp.cracked[s.id] = 1; }); cpSave(); },
  followAll(){ const c = curCase(); if(!c) return;
    c.clues.forEach(cl=>unlockLocsFor(cl.id));
    for(const L of c.locations) for(const n of L.npcs){
      cp.metNpc[n.id] = 1;
      (n.gives||[]).forEach(e=>{ cp.ev[e] = 1; });
      (n.names||[]).forEach(pid=>addPerson(pid));
      if(n.clears) cp.cleared[n.clears] = 1;
    }
    cpSave(); },
  pinAll(){ const c = curCase(); if(!c) return;
    for(const pid in (c.truth||{})){ cp.pins[pid] = Object.assign({}, c.truth[pid]); cp.people[pid] = 1; }
    cpSave(); },
  solve(){ const c = curCase(); if(!c) return;
    this.findAll(); this.followAll(); this.pinAll(); this.crack();
    cp.gathered = true; cp.gatherTalked = true; cp.accuseIntroDone = true; cpSave();
    doAccuse(c.culprit, c.provingClue); dlg && (dlg.i = dlg.lines.length-1); },
  finish(){ while(dlg) dlgAdvance(); },
  give(n){ save.coins += n; persist(); },
  ownAll(){ Object.keys(GEAR).forEach(id=>save.gear[id]=true); persist(); },
  reset(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} location.reload(); },
  validateCases, CASES, CHARACTERS, GEAR,
  get camX(){ return camX; }, set camX(v){ camX = v; }
};

/* ============================================================
   POINTER DISPATCH + FRAME LOOP
   ============================================================ */
function onPointerDown(p){
  if(trans) return;
  pointer.consumed = false;
  if(dlg){ dlgAdvance(); pointer.consumed = true; return; }
  if(hitButtons(p)){ pointer.consumed = true; return; }
  if(state === 'scene' && zoomMode){ lens.x = p.x; lens.y = Math.min(H-140, p.y); }
}
function onPointerDrag(p, dx, dy){
  if(trans || dlg || popup || journalOpen || cluePicker) return;
  if(state === 'scene'){
    if(zoomMode){ lens.x = p.x; lens.y = Math.min(H-140, p.y); }
    else camX = Math.max(0, Math.min(sceneW() - W, camX - dx));
  }
}
function onPointerUp(p, dragged){
  if(trans || dlg || pointer.consumed) return;
  if(state === 'scene' && !dragged && !zoomMode) sceneTap(p);
  if(state === 'scene' && !dragged && zoomMode) sceneTap(p);
}

let time = 0, lastT = 0, lastDt = 0.016, persistTimer = 0;
function frame(ts){ tick(ts); requestAnimationFrame(frame); }
window.__mmm.step = function(dt, n){
  dt = dt || 0.05; n = n || 1;
  const base = lastT;
  for(let i=1;i<=n;i++) tick(base + i*dt*1000);
};
function tick(ts){
  const dt = Math.min(0.05, (ts - lastT)/1000 || 0.016);
  lastT = ts; time += dt; lastDt = dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(shake > 0){
    shake -= dt;
    ctx.translate((Math.random()-0.5)*shake*26, (Math.random()-0.5)*shake*26);
  }
  uiButtons = [];
  stepConfetti(dt); stepFloaties(dt); stepSparkBursts(dt);
  ctx.clearRect(-20, -20, W+40, H+40);
  try{
    switch(state){
      case 'who':      drawWho(); break;
      case 'title':    drawTitle(); break;
      case 'creator':  drawCreator(); break;
      case 'gallery':  drawGallery(); break;
      case 'office':   drawOffice(); break;
      case 'casebook': drawCasebook(); break;
      case 'shop':     drawShop(); break;
      case 'briefing': drawBriefing(); break;
      case 'city':     drawCity(); break;
      case 'visit':    drawVisit(); break;
      case 'board':    drawBoard(); break;
      case 'gather':   drawGather(); break;
      case 'scene':    drawScene(); break;
      case 'talk':     drawTalk(); break;
      case 'accuse':   drawAccuse(); break;
      case 'reveal':   drawReveal(); break;
      case 'closed':   drawClosed(); break;
      default: menuBG(); txt('?', W/2, H/2, 40);
    }
  }catch(e){ console.error(e); }
  drawSparkBursts(); drawFloaties(); drawConfetti();
  stepDrawTrans(dt);
  musicTick();
  save.stats.playSec += dt;
  persistTimer += dt;
  if(persistTimer > 12){ persistTimer = 0; persist(); }
}
requestAnimationFrame(frame);
</script>
